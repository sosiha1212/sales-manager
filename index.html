}

/* ── 회원권 판매 등록 ───────────────────────────── */
let SELL = null;
function openSellMship(x){
  const c = db.customers.find(c=>c.id===x) || db.customers.find(c=>c.name===x);
  // 관리 입력에서 열었으면 그 화면의 담당 선생님을 판매자 기본값으로
  const defSeller = (page==='input' && IN && IN.teacherId) ? IN.teacherId : currentUser.id;
  SELL = { custId: c?c.id:'', _newName: c?'':(typeof x==='string'?x:''),
           sellerId: defSeller, type:'prepaid', productId:'', paid:0, total:0,
           count:10, programId: progs()[0]?.id, minutes: progMin(progs()[0]?.id), price:0, date: todayKST(),
           carry:false, balance:0, remain:0,
           storeId: (currentUser.storeIds||[])[0] || db.stores[0]?.id };
  const p = db.prepaidProducts.find(p=>p.active!==false);
  if(p){ SELL.productId=p.id; SELL.paid=p.paid; SELL.total=p.total; }
  drawSell();
}
function drawSell(){
  const body = `
    <div class="form-label">고객</div>
    <input class="form-control" list="custList2" id="slCust" value="${esc(SELL.custId?custName(SELL.custId):(SELL._newName||''))}"
           onchange="SELL.custId=(db.customers.find(c=>c.name===this.value)||{}).id||'';SELL._newName=this.value">
    <datalist id="custList2">${db.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
    <div class="gridin mt-2">
      <div><div class="form-label">결제일</div><input type="date" class="form-control" value="${SELL.date}" onchange="SELL.date=this.value"></div>
      <div><div class="form-label">지점</div><select class="form-select" onchange="SELL.storeId=this.value">
        ${db.stores.map(s=>`<option value="${s.id}" ${s.id===SELL.storeId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>
    <div class="form-label mt-2">판매한 선생님</div>
    ${isAdmin()? `<select class="form-select" onchange="SELL.sellerId=this.value;drawSell()">
        ${db.users.filter(x=>x.active!==false).map(x=>`<option value="${x.id}" ${x.id===SELL.sellerId?'selected':''}>${esc(x.name)} · 인센티브 ${pct(x.mshipRate||0,0)}</option>`).join('')}
      </select>`
    : `<div class="hint"><b>${esc(currentUser.name)}</b> · 인센티브 ${pct(currentUser.mshipRate||0,0)}</div>`}
    <div class="hint mt-1">회원권 판매 인센티브가 이 선생님에게 쌓입니다${
      (page==='input' && IN && IN.teacherId===SELL.sellerId) ? ' · <b style="color:var(--o)">관리 입력의 담당 선생님</b>' : ''}</div>
    <div class="form-label mt-2">회원권 종류</div>
    <div class="pick">
      <button class="${SELL.type==='prepaid'?'on':''}" onclick="SELL.type='prepaid';SELL.productId='';drawSell()">정액권</button>
      <button class="${SELL.type==='count'?'on':''}" onclick="SELL.type='count';SELL.productId='';drawSell()">횟수권</button>
    </div>
    ${SELL.type==='prepaid'? `
      <div class="form-label mt-2">상품</div>
      <select class="form-select" onchange="pickPrepaid(this.value)">
        ${db.prepaidProducts.filter(p=>p.active!==false).map(p=>`<option value="${p.id}" ${p.id===SELL.productId?'selected':''}>${esc(prepaidLabel(p))}</option>`).join('')}
        <option value="" ${!SELL.productId?'selected':''}>직접 입력</option>
      </select>
      <div class="gridin mt-2">
        <div><div class="form-label">실제 결제액</div><input type="text" inputmode="numeric" class="form-control money" value="${won(SELL.paid)}" oninput="fmtMoney(this);SELL.paid=num(this.value);SELL.productId='';sellPreview()"></div>
        <div><div class="form-label">총 사용 가능액</div><input type="text" inputmode="numeric" class="form-control money" value="${won(SELL.total)}" oninput="fmtMoney(this);SELL.total=num(this.value);SELL.productId='';sellPreview()"></div>
      </div>`
    : `
      <div class="form-label mt-2">상품</div>
      <select class="form-select" onchange="pickCount(this.value)">
        ${db.countProducts.filter(p=>p.active!==false).map(p=>`<option value="${p.id}" ${p.id===SELL.productId?'selected':''}>${esc(countLabel(p))}</option>`).join('')}
        <option value="" ${!SELL.productId?'selected':''}>직접 입력</option>
      </select>
      <div class="form-label mt-2">관리명</div>
      <select class="form-select" onchange="SELL.programId=this.value;SELL.minutes=progMin(this.value);SELL.productId='';sellPreview()">
        ${progGroups().map(g=>`<optgroup label="${esc(g.cat.name)}">${g.items.map(pg=>`<option value="${pg.id}" ${pg.id===SELL.programId?'selected':''}>${esc(progText(pg.id))}</option>`).join('')}</optgroup>`).join('')}
      </select>
      <div class="mt-2"><div class="form-label">횟수</div>
        <input type="number" class="form-control" value="${SELL.count}" oninput="SELL.count=num(this.value);SELL.productId='';sellPreview()"></div>
      <div class="mt-2"><div class="form-label">판매가</div><input type="text" inputmode="numeric" class="form-control money" value="${won(SELL.price)}" oninput="fmtMoney(this);SELL.price=num(this.value);SELL.productId='';sellPreview()"></div>`}
    <label class="d-flex align-items-center gap-2 mt-3" style="font-size:.86rem">
      <input type="checkbox" ${SELL.carry?'checked':''} onchange="SELL.carry=this.checked;SELL.balance=SELL.total;SELL.remain=SELL.count;drawSell()">
      이미 쓰고 계시던 회원권 (이월 등록)</label>
    ${SELL.carry? (SELL.type==='prepaid'
      ? `<div class="mt-2"><div class="form-label">현재 남은 잔액 (원)</div>
          <input type="text" inputmode="numeric" class="form-control money" value="${won(SELL.balance||SELL.total)}"
                 oninput="fmtMoney(this);SELL.balance=num(this.value);sellPreview()"></div>`
      : `<div class="mt-2"><div class="form-label">현재 남은 횟수</div>
          <input type="number" class="form-control" value="${SELL.remain||SELL.count}"
                 oninput="SELL.remain=num(this.value);sellPreview()"></div>`)
      : ''}
    ${SELL.carry?'<div class="hint mt-1">이월 등록은 이번 달 결제 수입과 판매 인센티브에 잡히지 않습니다.</div>':''}
    <div id="sellPv" class="mt-2">${sellPreviewHTML()}</div>`;
  modal('회원권 등록', body, `<button class="btn btn-o btn-sm" onclick="saveMship()">등록</button>`);
}
function pickPrepaid(id){ const p=db.prepaidProducts.find(x=>x.id===id); if(p){SELL.productId=id;SELL.paid=p.paid;SELL.total=p.total;} else SELL.productId=''; drawSell(); }
function pickCount(id){ const p=db.countProducts.find(x=>x.id===id);
  if(p){SELL.productId=id;SELL.count=p.count;SELL.programId=p.programId;SELL.minutes=progMin(p.programId)||p.minutes;SELL.price=p.price;}
  else SELL.productId=''; drawSell(); }
function sellPreview(){ document.getElementById('sellPv').innerHTML = sellPreviewHTML(); }
function sellPreviewHTML(){
  if(SELL.type==='prepaid'){
    if(!SELL.paid||!SELL.total) return '<div class="hint">결제액과 사용 가능액을 입력하세요.</div>';
    return `<div class="card2 tight" style="background:var(--o-soft);border-color:var(--o-line);margin:0">
      <div class="kv"><span>추가 적립률</span><b>+${pct(bonusRate(SELL.paid,SELL.total),2)}</b></div>
      <div class="kv"><span>실질 할인율</span><b>${pct(effDiscount(SELL.paid,SELL.total),2)}</b></div>
      ${SELL.carry?`<div class="kv"><span>등록할 잔액</span><b style="color:var(--o)">${wonW(SELL.balance||SELL.total)}</b></div>`:sellIncHTML(SELL.paid)}
      <div class="hint mt-1">${SELL.carry?'이월 등록 — 결제 수입에 잡히지 않습니다':`결제 수입 ${wonW(SELL.paid)}로 집계 (관리 매출과 합산 안 함)`}</div></div>`;
  }
  if(!SELL.price||!SELL.count) return '<div class="hint">횟수와 판매가를 입력하세요.</div>';
  const list=progPrice(SELL.programId);
  return `<div class="card2 tight" style="background:var(--o-soft);border-color:var(--o-line);margin:0">
    <div class="kv"><span>1회 인정 매출</span><b>${wonW(countUnit(SELL.price,SELL.count))}</b></div>
    ${list?`<div class="kv"><span>정상가 대비 할인율</span><b>${pct(countDisc(SELL.price,SELL.count,list),2)}</b></div>`:''}
    ${SELL.carry?`<div class="kv"><span>등록할 남은 횟수</span><b style="color:var(--o)">${SELL.remain||SELL.count}회</b></div>`:sellIncHTML(SELL.price)}
    <div class="hint mt-1">${SELL.carry?'이월 등록 — 결제 수입에 잡히지 않습니다':`결제 수입 ${wonW(SELL.price)}로 집계`}</div></div>`;
}
function sellIncHTML(amount){
  const u=getUser(SELL.sellerId)||{}; const r=u.mshipRate||0;
  if(!r) return '';
  return `<div class="kv"><span>${esc(u.name)} 판매 인센티브 (${pct(r,1)})</span><b style="color:var(--ok)">+${wonW(R(amount*r))}</b></div>`;
}
function saveMship(){
  let custId=SELL.custId;
  if(!custId){
    const nm=(SELL._newName||document.getElementById('slCust').value||'').trim();
    if(!nm){ toast('고객을 입력하세요','bad'); return; }
    const ex=db.customers.find(c=>c.name===nm);
    if(ex) custId=ex.id;
    else { custId=uid(); db.customers.push({id:custId,name:nm,phone:'',storeId:SELL.storeId,memo:'',createdAt:new Date().toISOString()}); }
  }
  const seller = isAdmin() ? (SELL.sellerId||currentUser.id) : currentUser.id;
  const sRate  = SELL.carry ? 0 : ((getUser(seller)||{}).mshipRate || 0);
  const newId  = uid();
  const base={ id:newId, customerId:custId, date:SELL.date, storeId:SELL.storeId,
               sellerId:seller, sellerRate:sRate, carry:!!SELL.carry,
               status:'active', createdAt:new Date().toISOString() };
  if(SELL.type==='prepaid'){
    if(SELL.paid<=0||SELL.total<=0){ toast('금액을 입력하세요','bad'); return; }
    const bal = SELL.carry ? R(SELL.balance||SELL.total) : R(SELL.total);
    if(bal<=0||bal>SELL.total){ toast('남은 잔액을 확인하세요','bad'); return; }
    db.memberships.push({ ...base, type:'prepaid', paid:R(SELL.paid), total:R(SELL.total), balance:bal,
                          incentive:R(SELL.paid*sRate) });
  } else {
    if(SELL.price<=0||SELL.count<=0){ toast('횟수와 판매가를 입력하세요','bad'); return; }
    const rem = SELL.carry ? R(SELL.remain||SELL.count) : R(SELL.count);
    if(rem<=0||rem>SELL.count){ toast('남은 횟수를 확인하세요','bad'); return; }
    db.memberships.push({ ...base, type:'count', count:R(SELL.count), programId:SELL.programId,
                          minutes:progMin(SELL.programId), unitList:progPrice(SELL.programId),
                          price:R(SELL.price), remain:rem, used:R(SELL.count)-rem, incentive:R(SELL.price*sRate) });
  }
  saveDB(); closeModal(); toast('회원권이 등록되었습니다','ok');
  if(page==='input' && IN){                       // 방금 등록한 회원권을 바로 적용
    IN.custId = custId; IN.custName = custName(custId);
    IN.manualPay = true;
    const m = getMship(newId);
    IN.payType = m.type; IN.mshipId = newId; syncFromMship();
    if(m.type==='prepaid' && !IN.touchedDeduct) IN.deduct = progPrice(IN.serviceId);
  }
  renderAll();
}
function voidMship(id){
  if(!confirm('이 회원권을 삭제합니다. 이미 사용한 관리 기록은 그대로 남습니다.')) return;
  const m=getMship(id); if(m){ m.status='void'; saveDB(); }
  closeModal(); toast('삭제되었습니다','ok'); renderCust();
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   4. 선생님 정산
   ═══════════════════════════════════════════════════ */
let SET_YM = null, SET_STORE = '';
function renderSettle(){
  SET_YM = SET_YM || thisYM();
  const ym = SET_YM, sid = isAdmin()? (SET_STORE||null) : null;
  const list = isAdmin() ? db.users.filter(u=>u.active!==false) : [currentUser];
  const rows = list.map(u=>settleOf(u.id, ym, sid)).filter(s=>isAdmin()? (s.count||s.fee||s.adj||s.pending.length||s.base) : true);
  const tot = rows.reduce((a,s)=>({real:a.real+s.real, fee:a.fee+s.fee, base:a.base+s.base,
      weekly:a.weekly+s.weekly, store:a.store+s.storeShare,
      msInc:a.msInc+s.msInc, wht:a.wht+s.wht, adj:a.adj+s.adj, pay:a.pay+s.pay}),
      {real:0,fee:0,base:0,weekly:0,store:0,msInc:0,wht:0,adj:0,pay:0});

  document.getElementById('p-settle').innerHTML = `
  ${isAdmin()?`<div class="seg">
    <button class="${!SET_STORE?'on':''}" onclick="SET_STORE='';renderSettle()">전체</button>
    ${db.stores.map(st=>`<button class="${SET_STORE===st.id?'on':''}" onclick="SET_STORE='${st.id}';renderSettle()">${esc(st.name)}</button>`).join('')}
  </div>`:''}
  <div class="d-flex align-items-center mb-2">
    <button class="btn btn-ghost btn-xs" onclick="SET_YM=prevYM(SET_YM);renderSettle()"><i class="bi bi-chevron-left"></i></button>
    <div class="fw-bold mx-2" style="font-size:.95rem">${ymText(ym)} 정산</div>
    <button class="btn btn-ghost btn-xs" onclick="SET_YM=nextYM(SET_YM);renderSettle()"><i class="bi bi-chevron-right"></i></button>
    <button class="btn btn-ghost btn-xs ms-auto" onclick="exportSettle('${ym}','${sid||''}')"><i class="bi bi-download"></i> 엑셀</button>
  </div>

  ${isAdmin()?`<div class="stat-grid mb-2">
    <div class="stat"><div class="lbl">${sid?esc(storeName(sid)):'전체'} 관리 인정 매출</div><div class="val sm num">${won(tot.real)}원</div></div>
    <div class="stat"><div class="lbl">관리 수수료·인센티브</div><div class="val sm num">${won(tot.fee)}원</div></div>
    <div class="stat"><div class="lbl">매장 몫 <span class="hint">관리자만</span></div>
      <div class="val sm num">${won(tot.store)}원</div>
      <div class="hint">회원권 인센티브 ${won(tot.msInc)}원${sid?'':` · 급여 ${won(tot.base+tot.weekly)}원`}</div></div>
    ${sid? `<div class="stat hl"><div class="lbl">${esc(storeName(sid))} 선생님 몫 소계</div>
        <div class="val sm num">${won(tot.fee+tot.msInc)}원</div>
        <div class="lbl">최종 지급액은 전체 탭에서</div></div>`
      : `<div class="stat hl"><div class="lbl">최종 지급 예정 합계</div><div class="val sm num">${won(tot.pay)}원</div></div>`}
  </div>`:''}

  ${isAdmin()? storeSummaryHTML(ym) : ''}

  ${rows.length? rows.map(s=>settleCardHTML(s, ym)).join('') : '<div class="empty">정산 대상이 없습니다.</div>'}

  ${calculatorHTML()}`;
  bindCalc();
}

/* 대전점 · 세종점 · 전체를 한 표에서 비교 */
function storeSummaryHTML(ym){
  const cols = [...db.stores.map(st=>({id:st.id,name:st.name})), {id:null,name:'전체'}];
  const data = cols.map(c=>{
    const rs = filterRecs({ym, storeId:c.id});
    const fee = sumFee(rs), real = sumReal(rs);
    return { ...c, real, fee, store: real-fee, pay: paymentIncome({ym, storeId:c.id}), n: rs.length };
  });
  return `<div class="card2">
    <div class="sec-t"><i class="bi bi-shop"></i>${ymText(ym)} 지점별 매출</div>
    <div class="scroll-x"><table class="tbl">
      <tr><th>구분</th><th class="r">건수</th><th class="r">관리 인정 매출</th><th class="r">선생님 몫</th><th class="r">매장 몫</th><th class="r">결제 수입</th></tr>
      ${data.map(d=>`<tr style="${d.id===null?'background:#fffaf6;font-weight:700':''}">
        <td><b>${esc(d.name)}</b></td>
        <td class="r num">${d.n}</td>
        <td class="r num">${won(d.real)}</td>
        <td class="r num">${won(d.fee)}</td>

    <div class="hint mt-2">매장 몫 = 관리 인정 매출 − 선생님 몫(수수료·인센티브). 결제 수입은 회원권 판매·단건 결제로 실제 들어온 돈이라 매출과 합산하지 않습니다.</div>

/* ── 근무시간 기록 (아르바이트) ────────────────────────────── */
function openWork(tid, ym){
  const u=getUser(tid);
  const ws=db.workLogs.filter(w=>w.teacherId===tid && ymOf(w.date)===ym).sort((a,b)=>a.date.localeCompare(b.date));
  const tot=ws.reduce((a,w)=>a+(+w.hours||0),0);
  const editable = isAdmin() || currentUser.id===tid;
  modal(`${esc(u.name)} · ${ymText(ym)} 근무시간`, `
    <div class="kv"><span>총 근무시간</span><b>${tot}시간</b></div>
    <div class="kv"><span>시급</span><b class="num">${wonW(u.hourly||0)}</b></div>
    <div class="kv"><span>근무 급여</span><b class="num" style="color:var(--o)">${wonW(R(tot*(u.hourly||0)))}</b></div>
    ${(()=>{ const wb=weeklyBonusOf(tid,ym,u.hourly||0); return wb.weeks.length?`
      <div class="kv"><span>주휴수당</span><b class="num">${wonW(wb.amount)}</b></div>
      ${wb.weeks.map(w=>`<div class="hint">· ${mdText(w.mon)}~${mdText(w.sun)} ${w.h}시간 → ${w.ok?won(w.amount)+'원':'15시간 미만'}</div>`).join('')}`:''; })()}
    <hr class="soft">
    ${ws.length?`<table class="tbl">${ws.map(w=>`<tr>
        <td class="num">${w.date.slice(5)}</td><td>${w.hours}시간
          ${w.inAt?`<div class="hint">${w.inAt}~${w.outAt}${w.breakMin?` 휴게 ${w.breakMin}분`:''}</div>`:''}</td>
        <td class="hint">${esc(w.memo||'')}</td>
        <td class="r">${editable?`<i class="bi bi-x-circle" style="cursor:pointer;color:var(--bad)" onclick="delWork('${w.id}','${tid}','${ym}')"></i>`:''}</td>
      </tr>`).join('')}</table>`:'<div class="hint">기록이 없습니다.</div>'}
    ${editable?`<hr class="soft">
    <div class="form-label">근무 기록 추가</div>
    <input type="date" id="wkDate" class="form-control" value="${ym===thisYM()?todayKST():ym+'-01'}">
    <div class="d-flex gap-2 mt-2 align-items-end">
      <div><div class="form-label">출근</div><input type="time" id="wkIn" class="form-control" onchange="calcWorkHours()"></div>
      <div><div class="form-label">퇴근</div><input type="time" id="wkOut" class="form-control" onchange="calcWorkHours()"></div>
      <div style="max-width:92px"><div class="form-label">휴게(분)</div>
        <input type="number" id="wkBreak" class="form-control" value="0" onchange="calcWorkHours()"></div>
    </div>
    <div class="d-flex gap-2 mt-2 align-items-end">
      <div class="flex-fill"><div class="form-label">근무시간 <span class="hint">출퇴근을 넣으면 자동 계산</span></div>
        <input type="number" step="0.5" id="wkHours" class="form-control" placeholder="예) 8"></div>
    </div>
    <input id="wkMemo" class="form-control mt-2" placeholder="메모 (선택)">`:''}
  `, editable?`<button class="btn btn-o btn-sm" onclick="addWork('${tid}','${ym}')">추가</button>`:'');
}
function calcWorkHours(){
  const i=document.getElementById('wkIn').value, o=document.getElementById('wkOut').value;
  if(!i||!o) return;
  const toMin = t => +t.slice(0,2)*60 + +t.slice(3,5);
  let mins = toMin(o) - toMin(i);
  if(mins<0) mins += 24*60;                                   // 자정 넘긴 근무
  mins -= R(num(document.getElementById('wkBreak').value));
  document.getElementById('wkHours').value = Math.max(0, Math.round(mins/60*100)/100);
}
function addWork(tid, ym){
  const date=document.getElementById('wkDate').value;
  const hours=num(document.getElementById('wkHours').value);
  if(!date||hours<=0){ toast('날짜와 시간을 입력하세요','bad'); return; }
  if(ymOf(date)!==ym){ toast(`${ymText(ym)} 날짜를 입력하세요`,'bad'); return; }
  const ex=db.workLogs.find(w=>w.teacherId===tid && w.date===date);
  if(ex && !confirm('같은 날 기록이 있습니다. 추가로 더할까요?')) return;
  db.workLogs.push({ id:uid(), teacherId:tid, date, hours,
                     inAt:document.getElementById('wkIn').value||'', outAt:document.getElementById('wkOut').value||'',
                     breakMin:R(num(document.getElementById('wkBreak').value)),
                     memo:document.getElementById('wkMemo').value.trim(),
                     createdBy:currentUser.id, createdAt:new Date().toISOString() });
  saveDB(); toast('추가되었습니다','ok'); openWork(tid, ym); renderSettle();
}
function delWork(id, tid, ym){
  db.workLogs = db.workLogs.filter(w=>w.id!==id);
  saveDB(); openWork(tid, ym); renderSettle();
}

function openAdj(tid, ym){
  modal(isAdmin()?'추가 지급 · 공제':'추가 비용 신청', `
    <div class="form-label">날짜</div><input type="date" id="ajDate" class="form-control" value="${todayKST()}">
    <div class="form-label mt-2">금액 <span class="hint">(지급은 +, 공제는 − 로 입력)</span></div>
    <input type="text" id="ajAmt" class="form-control money" placeholder="예) 50,000 또는 -30,000" oninput="fmtMoney(this)">
    <div class="form-label mt-2">사유</div><input id="ajWhy" class="form-control" placeholder="예) 재료비, 인센티브">
    ${!isAdmin()?'<div class="hint mt-2">신청 후 관리자 승인 시 정산에 반영됩니다.</div>':''}
  `, `<button class="btn btn-o btn-sm" onclick="saveAdj('${tid}','${ym}')">${isAdmin()?'반영':'신청'}</button>`);
}
function saveAdj(tid, ym){
  const amt=num(document.getElementById('ajAmt').value);
  const why=document.getElementById('ajWhy').value.trim();
  if(!amt){ toast('금액을 입력하세요','bad'); return; }
  if(!why){ toast('사유를 입력하세요','bad'); return; }
  db.adjustments.push({ id:uid(), teacherId:tid, ym, date:document.getElementById('ajDate').value,
    amount:R(amt), reason:why, status:isAdmin()?'approved':'pending',
    requestedBy:currentUser.id, createdAt:new Date().toISOString() });
  saveDB(); closeModal(); toast(isAdmin()?'반영되었습니다':'신청되었습니다','ok'); renderSettle();
}
function approveAdj(id, ok){
  const a=db.adjustments.find(x=>x.id===id); if(!a) return;
  if(ok){ a.status='approved'; a.approvedBy=currentUser.id; a.approvedAt=new Date().toISOString(); }
  else  { a.status='rejected'; }
  saveDB(); toast(ok?'승인되었습니다':'반려되었습니다','ok'); renderSettle();
}
function delAdj(id){
  if(!confirm('이 항목을 삭제할까요?')) return;
  db.adjustments = db.adjustments.filter(x=>x.id!==id);
  saveDB(); renderSettle();
}
function togglePaid(tid, ym){
  let s=db.settlements.find(x=>x.teacherId===tid&&x.ym===ym);
  if(!s){ s={teacherId:tid, ym, paid:false}; db.settlements.push(s); }
  if(!s.paid && !confirm(`${userName(tid)} 선생님의 ${ymText(ym)} 정산을 지급 완료로 처리할까요?`)) return;
  s.paid=!s.paid; s.paidAt=s.paid?new Date().toISOString():null; s.by=currentUser.id;
  saveDB(); toast(s.paid?'지급 완료 처리':'지급 완료 취소','ok'); renderSettle();
}

/* ── 엑셀(CSV) 다운로드 ─────────────────────────── */
function exportSettle(ym, sid){
  sid = sid || null;
  const list = isAdmin()? db.users.filter(u=>u.active!==false) : [currentUser];
  const adm = isAdmin();                         // 매장 몫은 관리자 파일에만 들어간다
  const head = ['선생님','근무형태','지점','관리 수수료율','회원권 인센티브율','건수','관리 인정 매출',
                '기본급·근무급여','근무시간','주휴수당','관리 수수료',
                ...(adm?['매장 몫']:[]),'회원권 판매액','회원권 인센티브',
                '공제 전 합계','공제','추가지급·공제','최종 지급 예정액','지급 여부'];
  const lines = [head.join(',')];
  list.forEach(u=>{
    const s=settleOf(u.id, ym, sid);
    if(!s.count && !s.fee && !s.adj && !s.base && !s.msInc) return;
    lines.push([ s.user.name, empName(u), (u.storeIds||[]).map(storeName).join(' '),
      pct(u.rate??db.settings.defaultRate,0), pct(u.mshipRate||0,0),
      s.count, s.real, s.base, s.hours, s.weekly, s.fee,
      ...(adm?[s.storeShare]:[]), s.msAmt, s.msInc,
      s.gross, s.wht, s.adj, s.pay, s.paid?'지급완료':'미지급' ].join(','));
  });
  lines.push('');
  lines.push('관리 상세');
  lines.push(['날짜','지점','선생님','고객','관리명','사용 회원권','적용 할인율','차감','관리 인정 매출','수수료'].join(','));
  filterRecs({ym, storeId:sid}).filter(r=>isAdmin()||r.teacherId===currentUser.id)
    .sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
      lines.push([ r.date, storeName(r.storeId), userName(r.teacherId), custName(r.customerId),
        progText(r.serviceId), usedMship(r).label,
        usedMship(r).disc!=null? pct(usedMship(r).disc,2) : '-',
        r.payType==='prepaid'?r.deduct+'원':r.payType==='count'?r.units+'회':'-',
        r.real, r.fee ].join(','));
    });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`스킨앤토크_정산_${ym}${sid?'_'+storeName(sid):''}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('다운로드했습니다','ok');
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   프리랜서 실매출 정산 계산기
   ═══════════════════════════════════════════════════ */
let CALC = null;
function initCalc(){
  const p = db.prepaidProducts.filter(x=>x.active!==false)[0] || {paid:1500000,total:1800000};
  const c = db.countProducts.filter(x=>x.active!==false)[0] || {count:10,programId:progs()[0]?.id,price:800000};
  CALC = { tab:'prepaid', pid:db.prepaidProducts[0]?.id||'', paid:p.paid, total:p.total,
           deduct: progs()[0]?.price || 100000, rate: Math.round((db.settings.defaultRate||.4)*100),
           cid:db.countProducts[0]?.id||'', count:c.count, price:c.price,
           prog: c.programId || progs()[0]?.id,
           list: progPrice(c.programId || progs()[0]?.id) || 100000 };
}
function calculatorHTML(){
  if(!CALC) initCalc();
  return `<details class="acc" id="calcAcc" ${CALC._open?'open':''}>
    <summary onclick="setTimeout(()=>CALC._open=document.getElementById('calcAcc').open,0)">
      <span><i class="bi bi-calculator" style="color:var(--o)"></i> 프리랜서 실매출 정산기</span></summary>
    <div class="hint mb-2">정액권 / 횟수권 · 관리 시간별 수수료 계산</div>
    <div class="seg" style="margin-bottom:10px">
      <button class="${CALC.tab==='prepaid'?'on':''}" onclick="CALC.tab='prepaid';drawCalc()">정액권</button>
      <button class="${CALC.tab==='count'?'on':''}" onclick="CALC.tab='count';drawCalc()">횟수권</button>
    </div>
    <div id="calcBody">${calcBodyHTML()}</div>
  </details>`;
}
function drawCalc(){
  const acc=document.getElementById('calcAcc'); if(acc) CALC._open=true;
  document.getElementById('calcAcc').outerHTML = calculatorHTML();
  document.getElementById('calcAcc').open = true;
  bindCalc();
}
function refreshCalcBody(){ document.getElementById('calcBody').innerHTML = calcBodyHTML(); bindCalc(); }
function bindCalc(){ /* 입력 이벤트는 인라인 핸들러 사용 */ }

function calcBodyHTML(){
  if(CALC.tab==='prepaid'){
    const real = prepaidReal(CALC.deduct, CALC.paid, CALC.total);
    const fee  = R(real * CALC.rate/100), store = real-fee;
    return `
    <div class="form-label">고객 정액권 선택</div>
    ${db.prepaidProducts.filter(p=>p.active!==false).map(p=>`
      <label class="d-flex align-items-center gap-2 py-1" style="font-size:.86rem">
        <input type="radio" name="cpP" ${CALC.pid===p.id?'checked':''} onchange="CALC.pid='${p.id}';CALC.paid=${p.paid};CALC.total=${p.total};refreshCalcBody()">
        <span>${won(p.paid/10000)}만원권 <span class="hint">(사용 가능 ${won(p.total/10000)}만원 · 적립 +${pct(bonusRate(p.paid,p.total),2)})</span></span></label>`).join('')}
    <label class="d-flex align-items-center gap-2 py-1" style="font-size:.86rem">
      <input type="radio" name="cpP" ${!CALC.pid?'checked':''} onchange="CALC.pid='';refreshCalcBody()"><span>직접 입력</span></label>
    ${!CALC.pid?`<div class="gridin mt-1">
      <div><div class="form-label">결제액</div><input type="text" inputmode="numeric" class="form-control money" value="${won(CALC.paid)}" oninput="fmtMoney(this);CALC.paid=num(this.value);refreshCalcResult()"></div>
      <div><div class="form-label">사용 가능액</div><input type="text" inputmode="numeric" class="form-control money" value="${won(CALC.total)}" oninput="fmtMoney(this);CALC.total=num(this.value);refreshCalcResult()"></div></div>`:''}
    <hr class="soft">
    <div class="form-label">1회 관리 차감 금액 (원)</div>
    <input type="text" inputmode="numeric" class="form-control money" value="${won(CALC.deduct)}" oninput="fmtMoney(this);CALC.deduct=num(this.value);refreshCalcResult()">
    <div class="mt-2">${progGroups().map(g=>`
      <div class="cat-head"><span class="cat-dot" style="background:${g.cat.color}"></span>${esc(g.cat.name)}
        <span class="cat-bar" style="background:${g.cat.color}"></span></div>
      <div class="pick">${g.items.map(pg=>{ const on=CALC.deduct===pg.price&&pg.price;
        return `<button style="box-shadow:inset 3px 0 0 ${g.cat.color};${on?`background:${g.cat.color}1A;border-color:${g.cat.color};color:${g.cat.color}`:''}"
          onclick="CALC.deduct=${pg.price};refreshCalcBody()">${esc(pg.name)}<span class="mins">${pg.price?won(pg.price):'미설정'}</span></button>`;}).join('')}</div>`).join('')}</div>
    <div class="form-label mt-2 d-flex justify-content-between">프리랜서 수수료율 <b style="color:var(--ink)">${CALC.rate}%</b></div>
    <input type="range" class="form-range" min="0" max="100" step="1" value="${CALC.rate}" oninput="CALC.rate=num(this.value);refreshCalcBody()">
    <div id="calcRes">${calcResHTML(real,fee,store,`실질 할인 ${pct(effDiscount(CALC.paid,CALC.total),2)}`,'고객 결제액 기준 실매출')}</div>
    <div class="formula mt-2">실매출 = 차감액 ${won(CALC.deduct)} × 결제액 ${won(CALC.paid)} ÷ 사용가능액 ${won(CALC.total)}<br>
      추가 적립률 +${pct(bonusRate(CALC.paid,CALC.total),2)} · 실질 할인율 ${pct(effDiscount(CALC.paid,CALC.total),2)}</div>`;
  }
  const unit = countUnit(CALC.price, CALC.count);
  const fee  = R(unit*CALC.rate/100), store = unit-fee;
  const disc = countDisc(CALC.price, CALC.count, CALC.list);
  return `
  <div class="form-label">고객 횟수권</div>
  ${db.countProducts.filter(p=>p.active!==false && p.programId===CALC.prog).map(p=>`
    <label class="d-flex align-items-center gap-2 py-1" style="font-size:.86rem">
      <input type="radio" name="cpC" ${CALC.cid===p.id?'checked':''} onchange="CALC.cid='${p.id}';CALC.count=${p.count};CALC.price=${p.price};refreshCalcBody()">
      <span>${p.count}회 · ${won(p.price/10000)}만원</span></label>`).join('')}
  <label class="d-flex align-items-center gap-2 py-1" style="font-size:.86rem">
    <input type="radio" name="cpC" ${!CALC.cid?'checked':''} onchange="CALC.cid='';refreshCalcBody()"><span>직접 입력</span></label>
  ${!CALC.cid?`<div class="gridin mt-1">
    <div><div class="form-label">횟수</div><input type="number" class="form-control" value="${CALC.count}" oninput="CALC.count=num(this.value);refreshCalcResult()"></div>
    <div><div class="form-label">판매가</div><input type="text" inputmode="numeric" class="form-control money" value="${won(CALC.price)}" oninput="fmtMoney(this);CALC.price=num(this.value);refreshCalcResult()"></div></div>`:''}
  <hr class="soft">
  <div class="form-label">관리명</div>
  ${progPicker(CALC.prog,'pickCalcProg')}
  <div class="form-label mt-2">1회 정상 관리가 (원)</div>
  <input type="text" inputmode="numeric" class="form-control money" value="${won(CALC.list)}" oninput="fmtMoney(this);CALC.list=num(this.value);refreshCalcResult()">
  <div class="form-label mt-2">프리랜서 수수료율 (%)</div>
  <input type="number" class="form-control" value="${CALC.rate}" oninput="CALC.rate=num(this.value);refreshCalcResult()">
  <div id="calcRes">${calcResHTML(unit,fee,store, disc>0?`${pct(disc,2)} 할인`:'', `실제 정산 결과 · ${esc(progText(CALC.prog))}`)}</div>
  <div class="formula mt-2">1회 실매출 = 판매가 ${won(CALC.price)} ÷ ${CALC.count}회 = ${wonW(unit)}<br>
    할인율 = 1 − (판매가÷횟수) ÷ 정상가 ${won(CALC.list)} = ${pct(disc,2)}</div>`;
}
function pickCalcProg(id){
  CALC.prog=id; CALC.list=progPrice(id)||CALC.list;
  const p=db.countProducts.find(x=>x.programId===id && x.active!==false && x.count===CALC.count)
       || db.countProducts.find(x=>x.programId===id && x.active!==false);
  if(p){ CALC.cid=p.id; CALC.count=p.count; CALC.price=p.price; }
  refreshCalcBody();
}
function refreshCalcResult(){
  let real, fee, store, badge, title;
  if(CALC.tab==='prepaid'){
    real = prepaidReal(CALC.deduct, CALC.paid, CALC.total);
    badge = `실질 할인 ${pct(effDiscount(CALC.paid,CALC.total),2)}`; title='고객 결제액 기준 실매출';
  } else {
    real = countUnit(CALC.price, CALC.count);
    const d = countDisc(CALC.price, CALC.count, CALC.list);
    badge = d>0?`${pct(d,2)} 할인`:''; title=`실제 정산 결과 · ${progText(CALC.prog)}`;
  }
  fee = R(real*CALC.rate/100); store = real-fee;
  document.getElementById('calcRes').innerHTML = calcResHTML(real,fee,store,badge,title);
}
function calcResHTML(real,fee,store,badge,title){
  return `<div class="card2 tight mt-2" style="background:var(--o-soft);border-color:var(--o-line);margin:0">
    <div class="d-flex justify-content-between align-items-center">
      <span class="lbl" style="color:var(--o)">${esc(title)}</span>
      ${badge?`<span class="badge-s">${esc(badge)}</span>`:''}</div>
    <div class="val num mt-1">${won(real)}<span style="font-size:.8rem">원</span></div>
    <hr class="soft" style="margin:8px 0">
    <div class="d-flex">
      <div class="flex-fill"><div class="lbl">선생님 지급액 (${CALC.rate}%)</div><div class="val sm num">${won(fee)}원</div></div>
      ${isAdmin()?`<div class="flex-fill"><div class="lbl">매장 잔여 매출</div><div class="val sm num">${won(store)}원</div></div>`:''}
    </div>
    <div class="hint mt-1">원 단위 반올림${isAdmin()?' · 매장 몫은 재료비·임대료·세금 차감 전 금액입니다.':''}</div>
  </div>`;
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   5. 설정 (관리자 전용)
   ═══════════════════════════════════════════════════ */
let SETTAB='price';
function renderSet(){
  if(!isAdmin()){ document.getElementById('p-set').innerHTML='<div class="empty">관리자만 접근할 수 있습니다.</div>'; return; }
  document.getElementById('p-set').innerHTML = `
  <div class="seg">
    ${[['price','가격'],['bonus','적립(정액권)'],['disc','할인(횟수권)'],['team','선생님'],['etc','기타']]
      .map(([k,n])=>`<button class="${SETTAB===k?'on':''}" onclick="SETTAB='${k}';renderSet()">${n}</button>`).join('')}
  </div>
  ${ SETTAB==='price'? setPriceHTML()
   : SETTAB==='bonus'? setBonusHTML()
   : SETTAB==='disc' ? setDiscHTML()
   : SETTAB==='team' ? setTeamHTML() : setEtcHTML() }`;
}

/* ── 가격 ─────────────────────────────────────── */
function setPriceHTML(){
  const gs = progGroups(db.programs.filter(p=>p.active!==false));
  return `
  <div class="card2">
    <div class="sec-t"><i class="bi bi-palette-fill"></i>관리 카테고리</div>
    <div class="hint mb-2">색과 순서를 정하면 관리 입력 화면에서 같은 순서·같은 색으로 묶여 보입니다.</div>
    ${cats().map((c,i,arr)=>`<div class="card2 tight" style="margin-bottom:9px">
      <div class="d-flex align-items-center gap-2">
        <span class="cat-dot" style="width:14px;height:14px;background:${c.color}"></span>
        <input class="form-control" value="${esc(c.name)}" onchange="cat_set('${c.id}','name',this.value)">
        <button class="ordbtn" onclick="cat_move('${c.id}',-1)" ${i===0?'disabled':''}>▲</button>
        <button class="ordbtn" onclick="cat_move('${c.id}',1)" ${i===arr.length-1?'disabled':''}>▼</button>
        <button class="btn btn-ghost btn-xs" onclick="cat_del('${c.id}')"><i class="bi bi-trash"></i></button>
      </div>
      <div class="swrap mt-2">${CAT_COLORS.map(col=>`<div class="sw ${col===c.color?'on':''}" style="background:${col}" onclick="cat_set('${c.id}','color','${col}')"></div>`).join('')}</div>
    </div>`).join('')}
    <div class="d-flex gap-2">
      <input id="ncName" class="form-control" placeholder="카테고리 추가 (예: 피부, 바디, 기타)">
      <button class="btn btn-o btn-xs" onclick="cat_add()">추가</button>
    </div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-tag-fill"></i>관리명별 정상가</div>
    ${gs.map(g=>`
      <div class="cat-head"><span class="cat-dot" style="background:${g.cat.color}"></span>${esc(g.cat.name)}
        <span class="cat-bar" style="background:${g.cat.color}"></span></div>
      ${g.items.map((pg,i,arr)=>`<div class="card2 tight" style="margin-bottom:9px;box-shadow:inset 4px 0 0 ${g.cat.color}">
        <div class="d-flex align-items-center gap-2">
          <input class="form-control" value="${esc(pg.name)}" onchange="pg_set('${pg.id}','name',this.value)">
          <button class="ordbtn" onclick="pg_move('${pg.id}',-1)" ${i===0?'disabled':''}>▲</button>
          <button class="ordbtn" onclick="pg_move('${pg.id}',1)" ${i===arr.length-1?'disabled':''}>▼</button>
          <button class="btn btn-ghost btn-xs" onclick="pg_del('${pg.id}')"><i class="bi bi-trash"></i></button>
        </div>
        <div class="gridin mt-2">
          <div><div class="form-label">관리 시간 (분)</div>
            <input type="number" class="form-control" value="${pg.minutes||''}" placeholder="선택" onchange="pg_set('${pg.id}','minutes',this.value)"></div>
          <div><div class="form-label">정상가 (원)</div>
            <input type="text" inputmode="numeric" class="form-control money" value="${won(pg.price)}"
                   oninput="fmtMoney(this)" onchange="pg_set('${pg.id}','price',this.value)"></div>
        </div>
        <div class="mt-2"><div class="form-label">카테고리</div>
          <select class="form-select" onchange="pg_set('${pg.id}','catId',this.value)">
            ${cats().map(c=>`<option value="${c.id}" ${c.id===pg.catId?'selected':''}>${esc(c.name)}</option>`).join('')}
            <option value="" ${!getCat(pg.catId)?'selected':''}>미분류</option>
          </select></div>
      </div>`).join('')}`).join('')}

    <div class="card2 tight" style="margin-bottom:0;background:#fcfbfa">
      <div class="form-label">관리 추가</div>
      <input id="npName" class="form-control" placeholder="관리명 (예: 엔더 60분, 된다리프팅 10만줄)">
      <div class="gridin mt-2">
        <div><div class="form-label">카테고리</div>
          <select id="npCat" class="form-select">${cats().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div><div class="form-label">시간(분)</div><input id="npMin" type="number" class="form-control" placeholder="선택"></div>
      </div>
      <div class="d-flex gap-2 mt-2">
        <input id="npPrice" type="text" inputmode="numeric" class="form-control money" placeholder="정상가" oninput="fmtMoney(this)">
        <button class="btn btn-o btn-xs" style="white-space:nowrap" onclick="pg_add()">추가</button>
      </div>
    </div>
    <div class="hint mt-2">여기 등록한 관리명이 관리 입력 화면의 선택지가 되고, 정상가는 차감 금액 기본값·횟수권 할인율 계산의 기준이 됩니다.
      변경해도 이미 저장된 기록과 판매된 회원권 조건은 바뀌지 않습니다.</div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-shop"></i>지점</div>
    ${db.stores.map(st=>`<div class="d-flex align-items-center gap-2 mb-2">
      <input class="form-control" value="${esc(st.name)}" onchange="st_rename('${st.id}',this.value)">
    </div>`).join('')}
    <div class="d-flex gap-2"><input id="newStore" class="form-control" placeholder="지점 추가">
      <button class="btn btn-o btn-xs" onclick="st_add()">추가</button></div>
  </div>`;
}

/* ── 카테고리 ── */
function cat_set(id,k,v){
  const c=getCat(id); if(!c) return;
  if(k==='name'){ if(!v.trim()) return; c.name=v.trim(); } else c[k]=v;
  saveDB(); renderSet();
}
function cat_add(){
  const n=document.getElementById('ncName').value.trim();
  if(!n){ toast('카테고리명을 입력하세요','bad'); return; }
  db.categories.push({ id:uid(), name:n, color:CAT_COLORS[db.categories.length%CAT_COLORS.length],
                       order:db.categories.length });
  saveDB(); toast('추가되었습니다','ok'); renderSet();
}
function cat_move(id,dir){
  const arr=cats(); arr.forEach((c,k)=>c.order=k);          // 순서 정규화
  const i=arr.findIndex(c=>c.id===id), j=i+dir;
  if(i<0||j<0||j>=arr.length) return;
  arr[i].order=j; arr[j].order=i;
  saveDB(); renderSet();
}
function cat_del(id){
  const used=db.programs.filter(p=>p.catId===id && p.active!==false).length;
  if(used && !confirm(`이 카테고리의 관리 ${used}개가 '미분류'로 바뀝니다. 삭제할까요?`)) return;
  if(!used && !confirm('삭제할까요?')) return;
  db.programs.forEach(p=>{ if(p.catId===id) p.catId=''; });
  db.categories=db.categories.filter(c=>c.id!==id);
  saveDB(); renderSet();
}

/* ── 관리명 ── */
function pg_set(id,k,v){
  const pg=getProg(id); if(!pg) return;
  if(k==='name'){ if(!v.trim()) return; pg.name=v.trim(); }
  else if(k==='catId'){ pg.catId=v; pg.order=db.programs.filter(x=>x.catId===v).length; }
  else pg[k]=R(num(v));
  saveDB(); renderSet();
}
function pg_move(id,dir){
  const pg=getProg(id); if(!pg) return;
  const arr=progs().filter(x=>x.catId===pg.catId);
  arr.forEach((x,k)=>x.order=k);                            // 순서 정규화
  const i=arr.findIndex(x=>x.id===id), j=i+dir;
  if(i<0||j<0||j>=arr.length) return;
  arr[i].order=j; arr[j].order=i;
  saveDB(); renderSet();
}
function pg_add(){
  const name=document.getElementById('npName').value.trim();
  if(!name){ toast('관리명을 입력하세요','bad'); return; }
  const cat=document.getElementById('npCat').value;
  db.programs.push({ id:uid(), name, catId:cat,
                     minutes:R(num(document.getElementById('npMin').value)),
                     price:R(num(document.getElementById('npPrice').value)),
                     order:db.programs.filter(x=>x.catId===cat).length, active:true });
  saveDB(); toast('추가되었습니다','ok'); renderSet();
}
function pg_del(id){
  if(db.programs.filter(p=>p.active!==false).length<=1){ toast('관리는 최소 1개 필요합니다','bad'); return; }
  if(!confirm('이 관리를 삭제할까요? 이미 저장된 기록과 회원권은 그대로 유지됩니다.')) return;
  const pg=getProg(id); if(pg) pg.active=false;
  saveDB(); renderSet();
}
function st_rename(id,v){ const st=db.stores.find(x=>x.id===id); if(st&&v.trim()){ st.name=v.trim(); saveDB(); } }
function st_add(){ const v=document.getElementById('newStore').value.trim(); if(!v) return;
  db.stores.push({id:uid(),name:v}); saveDB(); renderSet(); }

/* ── 적립 (정액권) ─────────────────────────────── */
function setBonusHTML(){
  const rate = db.settings.defaultRate||.4;
  return `
  <div class="card2">

function pp_del(id){ if(!confirm('삭제할까요? 이미 판매된 회원권은 그대로 유지됩니다.')) return;

/* ── 할인 (횟수권) ─────────────────────────────── */
let DISC_PROG = null;
function setDiscHTML(){
  if(!DISC_PROG || !getProg(DISC_PROG) || getProg(DISC_PROG).active===false) DISC_PROG = progs()[0]?.id;
  const list = progPrice(DISC_PROG);
  const ps = db.countProducts.filter(p=>p.programId===DISC_PROG).sort((a,b)=>a.count-b.count);
  const rate = db.settings.defaultRate||.4;
  return `
  <div class="card2">
    <div class="sec-t"><i class="bi bi-percent"></i>횟수권 할인 설정</div>
    <div class="hint mb-2">할인율을 입력하면 판매가가, 판매가를 입력하면 할인율이 자동 계산됩니다.
      <br>판매가 = 정상가 × 횟수 × (1 − 할인율) · 1회 인정 매출 = 판매가 ÷ 횟수</div>
    ${progPicker(DISC_PROG,'setDiscProg')}
    <div class="kv"><span>${progDot(DISC_PROG)} ${esc(progText(DISC_PROG))} 정상가</span><b class="num">${wonW(list)}</b></div>
    ${!list?'<div class="hint mt-1" style="color:var(--bad)">가격 탭에서 정상가를 먼저 입력하세요.</div>':''}
    ${ps.map(p=>{ const d=countDisc(p.price,p.count,list), u=countUnit(p.price,p.count), f=R(u*rate);
      return `<div class="card2 tight" style="margin:9px 0 0">
      <div class="d-flex align-items-center mb-1"><b>${p.count}회권</b>
        <button class="btn btn-ghost btn-xs ms-auto" onclick="cp_del('${p.id}')"><i class="bi bi-trash"></i></button></div>
      <div class="gridin">
        <div><div class="form-label">횟수</div>
          <input type="number" class="form-control" value="${p.count}" onchange="cp_count('${p.id}',this.value)"></div>
        <div><div class="form-label">할인율 (%)</div>
          <input type="number" step="0.01" class="form-control" value="${(d*100).toFixed(2).replace(/\.?0+$/,'')}" onchange="cp_disc('${p.id}',this.value)"></div>
      </div>
      <div class="mt-2"><div class="form-label">판매가 (원)</div>
        <input type="text" inputmode="numeric" class="form-control money" value="${won(p.price)}" oninput="fmtMoney(this)" onchange="cp_price('${p.id}',this.value)"></div>
      <div class="d-flex gap-3 mt-2 mini">
        <div><div class="lbl">1회 인정 매출</div><div class="fw-bold num" style="color:var(--o)">${wonW(u)}</div></div>
        <div><div class="lbl">선생님 ${pct(rate,0)}</div><div class="fw-bold num">${wonW(f)}</div></div>
        <div><div class="lbl">매장 몫</div><div class="fw-bold num">${wonW(u-f)}</div></div>
      </div>
    </div>`; }).join('')}
    <button class="btn btn-ghost w-100 btn-sm mt-2" onclick="cp_add()"><i class="bi bi-plus"></i> ${esc(progText(DISC_PROG))} 횟수권 추가</button>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-table"></i>전체 횟수권 요약</div>
    <div class="d-flex gap-2 mb-2 flex-wrap align-items-end">
      <div><div class="form-label">횟수</div><input id="bulkCnt" type="number" class="form-control" placeholder="예) 20" style="max-width:110px"></div>
      <div><div class="form-label">할인율 (%)</div><input id="bulkDisc" type="number" step="0.01" class="form-control" placeholder="예) 25" style="max-width:120px"></div>
      <button class="btn btn-o btn-xs" onclick="cp_bulk()">모든 관리에 추가</button>
    </div>
    <div class="hint mb-2">비어 있는 칸의 <b>+</b>를 누르면 그 관리에만 추가됩니다.</div>
    <div class="scroll-x"><table class="tbl">
      <tr><th>횟수</th>${progs().map(pg=>`<th class="r">${progDot(pg.id)} ${esc(progText(pg.id))}</th>`).join('')}</tr>
      ${[...new Set(db.countProducts.map(p=>p.count))].sort((a,b)=>a-b).map(c=>`<tr>
        <td><b>${c}회</b></td>
        ${progs().map(pg=>{ const p=db.countProducts.find(x=>x.count===c&&x.programId===pg.id);
          if(!p) return `<td class="r"><button class="btn btn-ghost btn-xs" onclick="cp_oneSave('${pg.id}',${c})">+</button></td>`;
          return `<td class="r num">${won(p.price)}<div class="hint">${pct(countDisc(p.price,p.count,pg.price),0)} 할인</div></td>`;
        }).join('')}</tr>`).join('')}
    </table></div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-arrow-left-right"></i>횟수권 관리 변경 규칙</div>
    <div class="hint mb-2">구매한 관리와 다른 관리를 받을 때의 차감 기준입니다.</div>
    <div class="pick">
      <button class="${db.settings.countSwitch==='amount'?'on':''}" onclick="db.settings.countSwitch='amount';saveDB();renderSet()">금액 비율 차감</button>
      <button class="${db.settings.countSwitch==='fixed'?'on':''}" onclick="db.settings.countSwitch='fixed';saveDB();renderSet()">1회 차감 + 차액 결제</button>
    </div>
    <div class="hint mt-2">${db.settings.countSwitch==='fixed'
      ? '예) 10만원 관리 10회권으로 15만원 관리 → 1회 차감 + 정상가 차액 50,000원 추가 결제'
      : '예) 10만원 관리 10회권(1회 8만원)으로 15만원 관리 → 1회 차감 + 부족분 40,000원 추가 결제 (같은 할인율 적용)'}
      <br>관리자는 입력 화면에서 건별로 직접 수정할 수 있습니다.</div>
  </div>`;
}
function setDiscProg(id){ DISC_PROG=id; renderSet(); }
function cp_find(id){ return db.countProducts.find(x=>x.id===id); }
function cp_count(id,v){ const p=cp_find(id); const list=progPrice(p.programId); const d=countDisc(p.price,p.count,list);
  p.count=Math.max(1,R(num(v))); if(list) p.price=countPriceOf(list,p.count,d); saveDB(); renderSet(); }
function cp_disc(id,v){ const p=cp_find(id); const list=progPrice(p.programId);
  if(!list){ toast('정상가를 먼저 입력하세요','bad'); return; }
  p.price=countPriceOf(list,p.count,num(v)/100); saveDB(); renderSet(); }
function cp_price(id,v){ const p=cp_find(id); p.price=R(num(v)); saveDB(); renderSet(); }
function cp_one(pgId, count, disc){
  const list=progPrice(pgId);
  if(!list) return false;                       // 정상가 없는 관리는 건너뜀
  if(db.countProducts.some(x=>x.programId===pgId && x.count===count)) return false;
  db.countProducts.push({id:uid(),count,programId:pgId,minutes:progMin(pgId),
    price:countPriceOf(list,count,disc??0.2),active:true});
  return true;
}
function cp_oneSave(pgId,count){
  if(cp_one(pgId,count)){ saveDB(); toast('추가되었습니다','ok'); renderSet(); }
  else toast('정상가를 먼저 입력하세요','bad');
}
function cp_bulk(){
  const c=R(num(document.getElementById('bulkCnt').value));
  const d=num(document.getElementById('bulkDisc').value)/100;
  if(c<=0){ toast('횟수를 입력하세요','bad'); return; }
  let n=0, skip=0;
  progs().forEach(pg=>{ if(cp_one(pg.id,c,d)) n++; else if(!progPrice(pg.id)) skip++; });
  saveDB();
  toast(n? `${n}개 관리에 ${c}회권 추가${skip?` (정상가 없는 ${skip}개 제외)`:''}` : '추가할 항목이 없습니다', n?'ok':'bad');
  renderSet();
}
function cp_add(){ const list=progPrice(DISC_PROG);
  db.countProducts.push({id:uid(),count:10,programId:DISC_PROG,minutes:progMin(DISC_PROG),
                         price:countPriceOf(list,10,.2),active:true}); saveDB(); renderSet(); }
function cp_del(id){ if(!confirm('삭제할까요? 이미 판매된 회원권은 유지됩니다.')) return;
  db.countProducts=db.countProducts.filter(x=>x.id!==id); saveDB(); renderSet(); }
</script>

function toggleEmpFields(t){
  const pt=document.getElementById('ufPart'), ft=document.getElementById('ufFull');
  if(pt) pt.style.display = t==='parttime'?'':'none';
  if(ft) ft.style.display = t==='fulltime'?'':'none';
}
function saveUser(id){
  const name=document.getElementById('ufName').value.trim();
  if(!name){ toast('이름을 입력하세요','bad'); return; }
  const pin=document.getElementById('ufPin').value.trim();
  if(!id && pin.length!==4){ toast('비밀번호 4자리를 입력하세요','bad'); return; }
  const dr=document.getElementById('ufDrate').value.trim();
  const o = { name, role:document.getElementById('ufRole').value,
    storeIds:[...document.querySelectorAll('.ufStore:checked')].map(c=>c.value),
    empType:document.getElementById('ufEmp').value,
    hourly:R(num(document.getElementById('ufHourly').value)),
    baseSalary:R(num(document.getElementById('ufBase').value)),
    rate:num(document.getElementById('ufRate').value)/100,
    mshipRate:num(document.getElementById('ufMship').value)/100,
    weeklyPay:document.getElementById('ufWeekly').checked,
    deduct:document.getElementById('ufWht').checked,
    deductRate: dr===''? null : num(dr)/100 };
  o.wht = o.deduct;
  if(id){
    const u=getUser(id); Object.assign(u,o);
    if(pin.length===4) u.pin=hashPin(pin);
    const off=document.getElementById('ufOff'); if(off) u.active=!off.checked;
  } else db.users.push({ id:uid(), ...o, pin:hashPin(pin), active:true });
  saveDB(); closeModal(); toast('저장되었습니다','ok'); renderSet();
}

function backupJSON(){
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`skintalk_backup_${todayKST()}.json`; document.body.appendChild(a); a.click(); a.remove();
}
function restoreJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{ try{ const d=JSON.parse(e.target.result);
      if(!confirm('현재 데이터를 백업 파일로 덮어씁니다. 진행할까요?')) return;
      db=normalize(d); saveDB(); toast('복원되었습니다','ok'); renderAll();
    }catch(err){ toast('파일을 읽을 수 없습니다','bad'); } };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('전체 데이터를 삭제합니다. 복구할 수 없습니다.')) return;
  if(!confirm('정말 삭제할까요? 지점·계정도 초기 상태로 돌아갑니다.')) return;
  db=seedDB(); saveDB(); toast('초기화되었습니다','ok'); logout();
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   샘플 데이터 · 계산 검증
   ═══════════════════════════════════════════════════ */
function runSelfTest(){
  const T=[];
  const eq=(name,got,want)=>T.push({name,got,want,ok:got===want});

  // 정액권: 10만원 관리 시
  eq('정액 150만/180만 · 10만 관리 실매출', prepaidReal(100000,1500000,1800000), 83333);
  eq('정액 150만/180만 · 수수료 40%',       R(prepaidReal(100000,1500000,1800000)*0.4), 33333);
  eq('정액 300만/400만 · 10만 관리 실매출', prepaidReal(100000,3000000,4000000), 75000);
  eq('정액 300만/400만 · 수수료 40%',       R(prepaidReal(100000,3000000,4000000)*0.4), 30000);
  eq('정액 500만/700만 · 10만 관리 실매출', prepaidReal(100000,5000000,7000000), 71429);
  eq('정액 500만/700만 · 수수료 40%',       R(prepaidReal(100000,5000000,7000000)*0.4), 28571);
  eq('정액 150만/180만 · 15만 차감 실매출', prepaidReal(150000,1500000,1800000), 125000);
  eq('추가 적립률 150→180',  pct(bonusRate(1500000,1800000),2), '20%');
  eq('실질 할인율 150→180',  pct(effDiscount(1500000,1800000),2), '16.67%');
  eq('추가 적립률 300→400',  pct(bonusRate(3000000,4000000),2), '33.33%');
  eq('실질 할인율 300→400',  pct(effDiscount(3000000,4000000),2), '25%');
  eq('추가 적립률 500→700',  pct(bonusRate(5000000,7000000),2), '40%');
  eq('실질 할인율 500→700',  pct(effDiscount(5000000,7000000),2), '28.57%');

  // 횟수권
  eq('횟수 10회 80만 · 1회 실매출',  countUnit(800000,10), 80000);
  eq('횟수 10회 80만 · 할인율',      pct(countDisc(800000,10,100000),2), '20%');
  eq('횟수 30회 225만 · 1회 실매출', countUnit(2250000,30), 75000);
  eq('횟수 30회 225만 · 할인율',     pct(countDisc(2250000,30,100000),2), '25%');
  eq('횟수 50회 350만 · 1회 실매출', countUnit(3500000,50), 70000);
  eq('횟수 50회 350만 · 할인율',     pct(countDisc(3500000,50,100000),2), '30%');
  eq('횟수 50회 350만 · 수수료 40%', R(countUnit(3500000,50)*0.4), 28000);
  eq('할인율 → 판매가 (90분 10회 20%)', countPriceOf(150000,10,.2), 1200000);
  eq('할인율 → 판매가 (120분 30회 25%)', countPriceOf(200000,30,.25), 4500000);

  // 차감 · 복원 시뮬레이션
  const m1={id:'_t1',type:'prepaid',paid:1500000,total:1800000,balance:1800000};
  const rec1={payType:'prepaid',membershipId:'_t1',deduct:100000,units:0};
  db.memberships.push(m1); applyMship(rec1,+1);
  eq('정액권 차감 후 잔액', m1.balance, 1700000);
  applyMship(rec1,-1);
  eq('취소 후 잔액 복원',  m1.balance, 1800000);
  const m2={id:'_t2',type:'count',count:10,price:800000,remain:10,used:0,unitList:100000};
  const rec2={payType:'count',membershipId:'_t2',units:2};
  db.memberships.push(m2); applyMship(rec2,+1);
  eq('횟수권 2회 차감 후 남은 횟수', m2.remain, 8);
  applyMship(rec2,-1);
  eq('취소 후 횟수 복원', m2.remain, 10);
  db.memberships = db.memberships.filter(m=>m.id!=='_t1'&&m.id!=='_t2');

  // 원천징수
  eq('수수료 100만 · 3.3% 원천징수', R(1000000*0.033), 33000);

  const bad=T.filter(t=>!t.ok);
  document.getElementById('testOut').innerHTML = `
    <div class="card2 tight" style="margin:0;background:${bad.length?'#fdeeee':'#eef7f2'};border-color:${bad.length?'#f3c9c9':'#cfe9dc'}">
      <b style="color:${bad.length?'var(--bad)':'var(--ok)'}">${bad.length? `${bad.length}건 실패 / 총 ${T.length}건` : `전체 ${T.length}건 통과 ✓`}</b>
      <div class="mt-1">${T.map(t=>`<div class="hint">${t.ok?'✓':'✗'} ${esc(t.name)} = ${esc(String(t.got))}${t.ok?'':` <span style="color:var(--bad)">(기대값 ${esc(String(t.want))})</span>`}</div>`).join('')}</div>
    </div>`;
  toast(bad.length?`${bad.length}건 실패`:'계산 검증 통과', bad.length?'bad':'ok');
}

function makeSample(){
  if(!confirm('샘플 고객과 관리 기록을 생성합니다. 진행할까요?')) return;
  let tchs = teachers();
  if(!tchs.length){
    db.users.push({id:uid(),name:'김선생',role:'teacher',pin:hashPin('1111'),storeIds:[db.stores[0].id],
      empType:'freelance',rate:.4,mshipRate:.05,hourly:0,baseSalary:0,deduct:true,deductRate:null,wht:true,active:true});
    db.users.push({id:uid(),name:'이알바',role:'teacher',pin:hashPin('2222'),storeIds:[db.stores[1]?.id||db.stores[0].id],
      empType:'parttime',rate:.1,mshipRate:.03,hourly:12000,baseSalary:0,deduct:true,deductRate:null,wht:true,active:true});
    db.users.push({id:uid(),name:'박정규',role:'teacher',pin:hashPin('3333'),storeIds:[db.stores[0].id],
      empType:'fulltime',rate:.1,mshipRate:.03,hourly:0,baseSalary:2200000,deduct:true,deductRate:null,wht:true,active:true});
    tchs = teachers();
  }
  const ym=thisYM(), pm=prevYM(ym), names=['김샘플','이샘플','박샘플'];
  const made=[];
  names.forEach((n,i)=>{
    let c=db.customers.find(x=>x.name===n);
    if(!c){ c={id:uid(),name:n,phone:'010-0000-000'+i,storeId:db.stores[i%db.stores.length].id,memo:'샘플',createdAt:new Date().toISOString()}; db.customers.push(c); }
    const st=c.storeId, d=`${ym}-01`;
    if(i<2){
      const p=db.prepaidProducts[i]||db.prepaidProducts[0];
      const sel=tchs[i%tchs.length];
      const m={id:uid(),customerId:c.id,type:'prepaid',paid:p.paid,total:p.total,balance:p.total,
               date:`${pm}-05`,storeId:st,sellerId:sel.id,sellerRate:sel.mshipRate||0,
               incentive:R(p.paid*(sel.mshipRate||0)),status:'active',createdAt:new Date().toISOString()};
      db.memberships.push(m); made.push({c,m,st});
    } else {
      const p=db.countProducts.find(x=>x.count===10)||db.countProducts[0];
      const m={id:uid(),customerId:c.id,type:'count',count:p.count,programId:p.programId,
               minutes:progMin(p.programId),unitList:progPrice(p.programId),price:p.price,
               remain:p.count,used:0,date:`${pm}-10`,storeId:st,sellerId:tchs[i%tchs.length].id,
               sellerRate:tchs[i%tchs.length].mshipRate||0,incentive:R(p.price*(tchs[i%tchs.length].mshipRate||0)),
               status:'active',createdAt:new Date().toISOString()};
      db.memberships.push(m); made.push({c,m,st});
    }
  });
  const today=todayKST(), dnum=dayOf(today);
  let n=0;
  made.forEach((x,i)=>{
    [`${pm}-12`,`${pm}-20`,`${ym}-${P2(Math.max(1,dnum-3))}`,today].forEach((date,k)=>{
      const u=tchs[(i+k)%tchs.length];
      const pgList=progs(), pg=pgList[k%pgList.length], minutes=pg.minutes;
      const c = calcRecord({ payType:x.m.type, mship:x.m, minutes,
        deduct:pg.price, units:1, extra:0, cashAmount:pg.price, rate:u.rate??.4 });
      if(x.m.type==='prepaid' && c.deduct>x.m.balance) return;
      if(x.m.type==='count'   && c.units>x.m.remain)   return;
      const rec={ id:uid(), date, storeId:x.st, teacherId:u.id, customerId:x.c.id,
        serviceId:pg.id, minutes, payType:x.m.type, membershipId:x.m.id,
        listPrice:pg.price, deduct:c.deduct, units:c.units, extra:c.extra,
        real:c.real, rate:c.rate, fee:c.fee, memo:'샘플',
        snapshot: x.m.type==='prepaid'?{type:'prepaid',paid:x.m.paid,total:x.m.total}
                                      :{type:'count',count:x.m.count,price:x.m.price,programId:x.m.programId},
        createdAt:new Date().toISOString(), createdBy:currentUser.id, canceled:false, history:[] };
      db.records.push(rec); applyMship(rec,+1); n++;
    });
  });
  // 아르바이트 선생님 근무 기록 샘플
  teachers().filter(u=>u.empType==='parttime').forEach(u=>{
    [[`${pm}-12`,8],[`${pm}-20`,6],[`${ym}-${P2(Math.max(1,dnum-3))}`,8],[today,5]].forEach(([d,hrs])=>{
      if(db.workLogs.some(w=>w.teacherId===u.id&&w.date===d)) return;
      db.workLogs.push({id:uid(),teacherId:u.id,date:d,hours:hrs,memo:'샘플',createdBy:currentUser.id,createdAt:new Date().toISOString()});
    });
  });
  saveDB(); toast(`샘플 ${n}건 생성`,'ok'); renderSet();
}

/* ═══════════════════════════════════════════════════
   시작
   ═══════════════════════════════════════════════════ */
(function boot(){
  buildLoginUsers(); buildPinPad();
  document.getElementById('loginUser').addEventListener('change',()=>{ pinBuf=''; drawPin(); document.getElementById('loginMsg').textContent=''; });
  document.addEventListener('keydown',e=>{
    if(document.getElementById('login').style.display==='none') return;
    if(/^[0-9]$/.test(e.key)) pinIn(e.key);
    if(e.key==='Backspace') pinIn('',true);
  });
  pullSupa();
  const sid=sessionStorage.getItem('skt_uid');
  if(sid && getUser(sid)){ document.getElementById('loginUser').value=sid; }
})();
</script>
