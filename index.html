<style>
:root{
  --o:#e56c2d; --o-dark:#c9551c; --o-soft:#fdf1ea; --o-line:#f6d9c8;
  --ink:#241a14; --mut:#8a7b72; --line:#ece6e2; --bg:#faf8f7;
  --ok:#17a673; --bad:#d9534f; --blue:#2f80ed;
}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;
     padding-bottom:calc(74px + env(safe-area-inset-bottom));font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
.cols{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media(min-width:900px){ .cols{grid-template-columns:1fr 1fr} .cols .card2{margin-bottom:0} }
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(170deg,#e56c2d,#c9551c);z-index:2000;
       display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:26px;padding:30px 26px;width:100%;max-width:370px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.brand{font-weight:800;letter-spacing:.14em;font-size:1.05rem;color:var(--o)}
.pin-dots{display:flex;gap:11px;justify-content:center;margin:20px 0}
.pin-dot{width:13px;height:13px;border-radius:50%;background:#e8e2de;transition:.15s}
.pin-dot.on{background:var(--o);transform:scale(1.15)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pin-btn{padding:15px 0;border:none;border-radius:16px;background:var(--o-soft);font-size:1.25rem;font-weight:700;color:var(--ink)}
.pin-btn:active{background:var(--o-line)}
.pin-btn.fn{background:#f4f2f0;color:var(--mut);font-size:1rem}

/* HEADER */
.topbar{background:var(--o);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
        position:sticky;top:0;z-index:900}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px}
.topbar .t-name{font-weight:800;font-size:.95rem;letter-spacing:.02em}
.chip{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700}
.sync{font-size:.68rem;opacity:.9;margin-left:auto}

/* NAV */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:950;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:1fr;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(36,26,20,.05)}
.bottomnav-in{max-width:1080px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(6,1fr)}
.navb{border:none;background:none;padding:9px 0 7px;font-size:.63rem;font-weight:700;color:#b3a69e;line-height:1.35}
.navb i{display:block;font-size:1.22rem;margin-bottom:1px}
.navb.on{color:var(--o)}

/* CARD */
.card2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;
        box-shadow:0 1px 2px rgba(36,26,20,.035)}
.card2.tight{padding:12px}
.sec-t{font-weight:800;font-size:.9rem;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.sec-t .bi{color:var(--o)}
.lbl{font-size:.72rem;color:var(--mut);font-weight:700;margin-bottom:3px}
.val{font-size:1.32rem;font-weight:800;letter-spacing:-.02em}
.val.sm{font-size:1.05rem}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:760px){ .stat-grid{grid-template-columns:repeat(4,1fr)} }
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:0 1px 2px rgba(36,26,20,.035)}
.stat.hl{background:var(--o);border-color:var(--o);color:#fff}
.stat.hl .lbl{color:rgba(255,255,255,.85)}
.delta{font-size:.72rem;font-weight:700}
.up{color:var(--ok)} .down{color:var(--bad)}

/* SEGMENT */
.seg{display:flex;background:#f0ebe8;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 0 auto;border:none;background:none;border-radius:10px;padding:7px 12px;font-size:.8rem;font-weight:700;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--o);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* FORM */
.form-label{font-size:.76rem;font-weight:700;color:var(--mut);margin-bottom:4px}
.form-control,.form-select{border-radius:12px;border-color:#e3dcd7;padding:10px 12px;font-size:.92rem}
.form-control:focus,.form-select:focus{border-color:var(--o);box-shadow:0 0 0 .18rem rgba(229,108,45,.15)}
.btn-o{background:var(--o);color:#fff;border:none;border-radius:13px;font-weight:700;padding:11px 16px}
.btn-o:hover,.btn-o:focus{background:var(--o-dark);color:#fff}
.btn-o:disabled{opacity:.55}
.btn-ghost{background:#fff;border:1px solid var(--o-line);color:var(--o);border-radius:12px;font-weight:700}
.btn-xs{font-size:.72rem;padding:4px 9px;border-radius:9px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid #e3dcd7;background:#fff;border-radius:11px;padding:8px 13px;font-size:.84rem;font-weight:700;color:var(--mut)}
.pick button.on{background:var(--o-soft);border-color:var(--o);color:var(--o)}

/* TABLE */
.tbl{width:100%;font-size:.82rem;border-collapse:collapse}
.tbl th{font-size:.7rem;color:var(--mut);font-weight:700;padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid #f4f0ed;vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge-s{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--o-soft);color:var(--o)}
.badge-g{background:#eef7f2;color:var(--ok)}
.badge-r{background:#fdeeee;color:var(--bad)}
.badge-b{background:#eef3fd;color:var(--blue)}
.badge-n{background:#f2efed;color:var(--mut)}
.muted{color:var(--mut);font-size:.78rem}
.empty{text-align:center;color:#b9aca4;font-size:.82rem;padding:26px 10px}
hr.soft{border-color:var(--line);opacity:1;margin:12px 0}
.calc-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:.85rem}
.calc-row b{font-weight:800}
.formula{font-size:.7rem;color:var(--mut);background:#faf7f5;border-radius:9px;padding:7px 9px;line-height:1.5}
.cat-head{display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;color:var(--mut);margin:10px 0 5px}
.cat-head:first-child{margin-top:0}
.cat-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cat-bar{height:3px;border-radius:2px;flex:1;opacity:.35}
.pick button .mins{opacity:.6;font-weight:700;margin-left:3px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px #e3dcd7;cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swrap{display:flex;gap:7px;flex-wrap:wrap}
.ordbtn{border:1px solid #e3dcd7;background:#fff;border-radius:8px;width:28px;height:26px;font-size:.7rem;color:var(--mut);padding:0}
.ordbtn:disabled{opacity:.3}
input.money{text-align:right;font-variant-numeric:tabular-nums}
.page{display:none}
.page.on{display:block;padding:16px 14px 12px;max-width:1080px;margin:0 auto}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));z-index:1600;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast2{background:#2b211b;color:#fff;border-radius:12px;padding:10px 16px;font-size:.84rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast2.bad{background:var(--bad)}
.toast2.ok{background:var(--ok)}
canvas{max-width:100%}
.gridin{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{font-size:.74rem}
details.acc{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 12px;margin-bottom:10px}
details.acc>summary{font-weight:800;font-size:.85rem;list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"\F282";font-family:bootstrap-icons;color:var(--mut);font-size:.8rem}
details.acc[open]>summary::after{content:"\F286"}
.hint{font-size:.72rem;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.66rem;font-weight:800;color:var(--mut);padding:3px 0}
.cal .cell{border:1px solid var(--line);border-radius:10px;min-height:62px;padding:5px 6px;background:#fff;

.cal .cell.off{background:#fbf9f8;border-style:dashed;opacity:.55}
.cal .cell.has{border-color:var(--o-line);background:#fffaf6;cursor:pointer}
.cal .cell.today{box-shadow:inset 0 0 0 2px var(--o)}
.cal .d{font-size:.68rem;font-weight:800;color:var(--mut)}
.cal .amt{font-size:.7rem;font-weight:800;color:var(--o);font-variant-numeric:tabular-nums}
.cal .nm{font-size:.62rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:760px){ .cal .cell{min-height:92px} .cal .nm{font-size:.68rem} }
.bell{position:relative;cursor:pointer;font-size:1.15rem}
.bell .bdg{position:absolute;top:-5px;right:-8px;background:#fff;color:var(--o);border-radius:999px;
  font-size:.58rem;font-weight:800;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.pop{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1700;
  max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--o-line);border-radius:16px;
  box-shadow:0 14px 40px rgba(36,26,20,.22);padding:13px 15px;animation:popin .25s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop .ttl{font-size:.74rem;font-weight:800;color:var(--o);display:flex;align-items:center;gap:5px}
.warnrow{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;
         padding:7px 9px;border-radius:10px;background:#fff6f1;border:1px solid var(--o-line);margin-top:6px}
.kv{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;border-bottom:1px dashed #efe9e5}
.kv:last-child{border-bottom:none}
</style>

<script>
/* ═══════════════════════════════════════════════════════════
   SKIN & TALK — 매출 · 자동 정산
   데이터: localStorage + Supabase(app_data / id='skt_v3')
   ═══════════════════════════════════════════════════════════ */

const DB_KEY   = 'sktApp_v3';
const ROW_ID   = 'skt_v3';
const SUPA_URL = 'https://orbjqhjkewuijroojlui.supabase.co';
const SUPA_KEY = 'sb_publishable_9t6hMtCG1S_rvUDEmnh-sA_cdmHvYD0';
const _supa = window.supabase?.createClient(SUPA_URL, SUPA_KEY);

/* ── 한국시간(KST) ───────────────────────────────── */
const P2 = n => String(n).padStart(2,'0');
function kstDate(ts){ return new Date((ts ?? Date.now()) + 9*3600*1000); }
function todayKST(){ const d=kstDate(); return `${d.getUTCFullYear()}-${P2(d.getUTCMonth()+1)}-${P2(d.getUTCDate())}`; }
function nowKSTText(){ const d=kstDate(); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${P2(d.getUTCHours())}:${P2(d.getUTCMinutes())}`; }
function ymOf(dateStr){ return dateStr.slice(0,7); }
function thisYM(){ return todayKST().slice(0,7); }
function dayOf(dateStr){ return +dateStr.slice(8,10); }
function prevYM(ym){ let [y,m]=ym.split('-').map(Number); m--; if(m===0){m=12;y--;} return `${y}-${P2(m)}`; }
function nextYM(ym){ let [y,m]=ym.split('-').map(Number); m++; if(m===13){m=1;y++;} return `${y}-${P2(m)}`; }
function daysInYM(ym){ const [y,m]=ym.split('-').map(Number); return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function ymText(ym){ const [y,m]=ym.split('-'); return `${y}년 ${+m}월`; }
function addDaysISO(dateStr,n){ const d=new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n);
  return `${d.getUTCFullYear()}-${P2(d.getUTCMonth()+1)}-${P2(d.getUTCDate())}`; }
function mondayOf(dateStr){ const d=new Date(dateStr+'T00:00:00Z'); return addDaysISO(dateStr, -((d.getUTCDay()+6)%7)); }
const mdText = d => `${+d.slice(5,7)}/${+d.slice(8,10)}`;

/* ── 금액 ────────────────────────────────────────── */
const won  = n => Math.round(n||0).toLocaleString('ko-KR');
const wonW = n => won(n)+'원';
const R    = n => Math.round(n||0);               // 원 단위 반올림
const pct  = (n,d=1) => (n*100).toFixed(d).replace(/\.0+$/,'')+'%';
const num  = v => { const n = parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const esc  = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid  = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* 금액 입력칸: 세 자리마다 쉼표를 찍으면서 입력받는다 */
function fmtMoney(el){
  const neg  = /^\s*-/.test(el.value);
  const tail = el.value.length - (el.selectionStart ?? el.value.length);
  const d    = el.value.replace(/[^0-9]/g,'');
  el.value   = (neg?'-':'') + (d ? Number(d).toLocaleString('ko-KR') : '');
  const pos  = Math.max(0, el.value.length - tail);
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}

/* ═══ 핵심 계산식 ═══════════════════════════════════
   정액권: 추가 적립률 = (사용가능액-결제액)/결제액
           실질 할인율 = (사용가능액-결제액)/사용가능액
           관리 인정 매출 = 차감액 × 결제액 ÷ 사용가능액
   횟수권: 1회 인정 매출 = 판매가 ÷ 계약 횟수
           할인율 = 1 − (판매가÷횟수) ÷ 정상가
           판매가 = 정상가 × 횟수 × (1−할인율)
   수수료 = 인정 매출 × 선생님 수수료율
   ═════════════════════════════════════════════════ */
const bonusRate    = (paid,total)      => paid>0  ? (total-paid)/paid  : 0;
const effDiscount  = (paid,total)      => total>0 ? (total-paid)/total : 0;
const prepaidReal  = (deduct,paid,tot) => tot>0   ? R(deduct*paid/tot) : 0;
const countUnit    = (price,cnt)       => cnt>0   ? R(price/cnt)       : 0;
const countDisc    = (price,cnt,list)  => (list>0 && cnt>0) ? 1-(price/cnt)/list : 0;
const countPriceOf = (list,cnt,disc)   => R(list*cnt*(1-disc));

/* ── 기본(초기) 데이터 ───────────────────────────── */
function seedDB(){
  const daejeon = uid(), sejong = uid();
  return {
    v:3, _savedAt:null,
    stores:[{id:daejeon,name:'대전점'},{id:sejong,name:'세종점'}],
    users:[{id:uid(),name:'관리자',role:'admin',pin:hashPin('1234'),storeIds:[daejeon,sejong],
            empType:'freelance', rate:0.4, mshipRate:0, hourly:0, baseSalary:0,
            deduct:false, deductRate:null, wht:false, active:true}],
    categories:[
      {id:'cat-skin', name:'피부', color:'#e56c2d', order:0},
      {id:'cat-body', name:'바디', color:'#2f80ed', order:1},
      {id:'cat-etc',  name:'기타', color:'#8a7b72', order:2}
    ],
    programs:[
      {id:'pg60', name:'바디관리',   minutes:60,  price:100000, catId:'cat-body', order:0, active:true},
      {id:'pg90', name:'바디관리',   minutes:90,  price:150000, catId:'cat-body', order:1, active:true},
      {id:'pg120',name:'바디관리',   minutes:120, price:200000, catId:'cat-body', order:2, active:true},
      {id:'pg30', name:'페이스관리', minutes:30,  price:0,      catId:'cat-skin', order:0, active:true}
    ],
    prepaidProducts:[
      {id:uid(),paid:1500000,total:1800000,active:true},
      {id:uid(),paid:3000000,total:4000000,active:true},
      {id:uid(),paid:5000000,total:7000000,active:true}
    ],
    countProducts:[

function hashPin(pin){ let h=0; for(let i=0;i<pin.length;i++) h=(Math.imul(31,h)+pin.charCodeAt(i))|0; return Math.abs(h).toString(16).padStart(8,'0'); }

function loadLocal(){ try{ const r=localStorage.getItem(DB_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function normalize(d){
  const base = seedDB();
  // 구버전(시간별 가격) → 신버전(관리명별 가격) 이행
  if (!d.programs){
    const durs = d.durations || [30,60,90,120];
    d.programs = durs.map(m=>({ id:uid(), name:`${m}분 관리`, minutes:m,
                                price:+((d.prices||{})[m]||0), active:true }));
  }
  for (const k of Object.keys(base)) if (d[k]===undefined) d[k]=base[k];
  d.settings = Object.assign({}, base.settings, d.settings||{});
  d.settings.weekly = Object.assign({on:true,minHours:15,fullHours:40,payHours:8}, d.settings.weekly||{});
  if(d.settings.redCount==null){                 // 2단계 경고 기준 도입
    d.settings.redCount=1; d.settings.redAmount=100000;
    if(d.settings.lowCount===2)      d.settings.lowCount=3;
    if(d.settings.lowAmount===150000) d.settings.lowAmount=300000;
  }
  // 카테고리 · 정렬 순서
  d.categories.forEach((c,i)=>{ if(c.order==null) c.order=i; });
  d.programs.forEach((pg,i)=>{ if(pg.order==null) pg.order=i; });
  // 횟수권 상품·회원권을 관리명에 연결
  (d.countProducts||[]).forEach(cp=>{
    if(!cp.programId){ const pg=d.programs.find(x=>x.minutes===cp.minutes); if(pg) cp.programId=pg.id; }
  });
  // 근무형태 · 인센티브 필드
  (d.users||[]).forEach(u=>{
    if(!u.empType)        u.empType  = 'freelance';
    if(u.mshipRate==null) u.mshipRate= 0;
    if(u.hourly==null)    u.hourly   = 0;
    if(u.baseSalary==null)u.baseSalary=0;
    if(u.deduct==null)    u.deduct   = !!u.wht;
    if(u.deductRate===undefined) u.deductRate = null;
  });
  (d.memberships||[]).forEach(m=>{
    if(m.type!=='count') return;
    if(!m.programId){ const pg=d.programs.find(x=>x.minutes===m.minutes); if(pg) m.programId=pg.id; }
    if(m.unitList==null){ const pg=d.programs.find(x=>x.id===m.programId); m.unitList=pg?pg.price:0; }
  });
  return d;
}
let db = normalize(loadLocal() || seedDB());

function saveDB(push=true){
  db._savedAt = new Date().toISOString();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ toast('저장 공간 부족','bad'); }

}
let _pushTimer=null;
function pushSupa(){
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(async ()=>{
    if(!_supa){ syncMsg('⚠️ 서버 연결 없음','#ffd8c6'); return; }
    syncMsg('↻ 저장 중…','#fff');
    const { error } = await _supa.from('app_data')
      .upsert({ id:ROW_ID, data:db, updated_at:new Date().toISOString() });
    if (error){ console.warn(error); syncMsg('⚠️ 서버 저장 실패','#ffd8c6'); }
    else syncMsg('☁️ 저장됨','#fff');
  }, 400);
}
async function pullSupa(quiet){
  if(!_supa) return;
  try{
    const { data, error } = await _supa.from('app_data').select('data').eq('id',ROW_ID);
    if (error){ syncMsg('⚠️ 오프라인','#ffd8c6'); return; }
    if (data && data.length && data[0].data){
      const srv = data[0].data;
      const sT = srv._savedAt||'', lT = db._savedAt||'';
      if (sT > lT || (!quiet && sT >= lT)){
        const beforeIds = new Set(db.records.map(r=>r.id));
        db = normalize(srv);
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        syncMsg('☁️ 동기화됨','#fff');
        if (currentUser){
          const fresh = unseenRecs().filter(r=>!beforeIds.has(r.id));
          if (fresh.length) showPopup(fresh);
          refreshBell();
          if (!isBusy()) renderAll();
        } else buildLoginUsers();
      } else if (sT < lT) pushSupa();                    // 로컬이 최신 → 서버 갱신
      else syncMsg('☁️ 동기화됨','#fff');
    } else { pushSupa(); }
  }catch(e){ syncMsg('⚠️ 오프라인','#ffd8c6'); }
}

const storeName = id => (db.stores.find(s=>s.id===id)||{}).name || '-';

const CAT_COLORS = ['#e56c2d','#d6336c','#7950f2','#2f80ed','#0ca678','#f59f00','#495057','#8a7b72'];
const cats      = () => db.categories.slice().sort((a,b)=>(a.order??0)-(b.order??0));
const getCat    = id => db.categories.find(c=>c.id===id);
const catColor  = id => getCat(id)?.color || '#b9aca4';
const catName   = id => getCat(id)?.name  || '미분류';
const catOrder  = id => { const c=getCat(id); return c ? (c.order??900) : 999; };
const progs     = () => db.programs.filter(p=>p.active!==false)
  .sort((a,b)=> (catOrder(a.catId)-catOrder(b.catId)) || ((a.order??0)-(b.order??0)));
/* 카테고리별로 묶은 관리 목록 (빈 카테고리는 제외) */
function progGroups(list){
  const src = list || progs();
  const out = cats().map(c=>({ cat:c, items:src.filter(p=>p.catId===c.id) }));
  const none = src.filter(p=>!getCat(p.catId));
  if(none.length) out.push({ cat:{id:'',name:'미분류',color:'#b9aca4'}, items:none });
  return out.filter(g=>g.items.length);
}
/* 그 관리에 실제로 쓰인 회원권 — 저장 시점 스냅샷 기준 */
function usedMship(r){
  const sn = r.snapshot || {};
  if(r.payType==='prepaid'){
    const paid = sn.paid ?? getMship(r.membershipId)?.paid, tot = sn.total ?? getMship(r.membershipId)?.total;
    if(!paid||!tot) return { label:'정액권', disc:null };
    return { label:`정액 ${won(paid/10000)}만원권`, disc:effDiscount(paid,tot) };
  }
  if(r.payType==='count'){
    const cnt = sn.count ?? getMship(r.membershipId)?.count, pr = sn.price ?? getMship(r.membershipId)?.price;
    const pid = sn.programId ?? getMship(r.membershipId)?.programId;
    if(!cnt||!pr) return { label:'횟수권', disc:null };
    const list = progPrice(pid) || r.listPrice;
    return { label:`${getProg(pid)?progText(pid)+' ':''}${cnt}회권`, disc: list? countDisc(pr,cnt,list) : null };
  }
  return { label:'단건 결제', disc:0 };
}
const usedText = r => { const u=usedMship(r);
  return u.label + (u.disc? ` · 할인 ${pct(u.disc,2)}` : (r.payType==='single'?'':'')); };

const progDot = id => `<span class="cat-dot" style="display:inline-block;background:${catColor(getProg(id)?.catId)}"></span>`;

/* 카테고리별로 묶어 색을 입힌 관리명 선택기 */
function progBtn(pg, selId, fn, extra){

function progPicker(selId, fn, list, extra){

    <div class="pick">${g.items.map(pg=>progBtn(pg,selId,fn,extra)).join('')}</div>`).join('');
}
const getProg   = id => db.programs.find(p=>p.id===id);
const progName  = id => getProg(id)?.name || '-';
const progPrice = id => +(getProg(id)?.price || 0);

const mshipList = m => +(m.unitList || progPrice(m.programId) || listPriceOf(m.minutes) || 0);
const teachers  = () => db.users.filter(u=>u.role==='teacher' && u.active!==false);

const deductRateOf = u => !deductOn(u) ? 0
  : (u.deductRate!=null ? u.deductRate
     : (empOf(u)==='freelance' ? (db.settings.whtRate||0) : (db.settings.insRate||0)));
const deductName = u => empOf(u)==='freelance' ? '원천징수' : '4대보험 공제';
const mshipAmount = m => (m.type==='prepaid') ? m.paid : m.price;
const mshipIncOf  = m => (m.incentive!=null) ? m.incentive
                       : R(mshipAmount(m) * ((getUser(m.sellerId)||{}).mshipRate || 0));
const liveRecords = () => db.records.filter(r=>!r.canceled);

/* 잔여량 경고 단계: red(임박) / warn(주의) / '' */
function mshipLevel(m){
  if(!m || m.status==='void') return '';
  const S=db.settings;
  if(m.type==='count'){
    if(m.remain<=0) return '';
    if(m.remain<=(S.redCount??1))  return 'red';
    if(m.remain<=(S.lowCount??3))  return 'warn';
    return '';
  }
  if(m.balance<=0) return '';
  if(m.balance<=(S.redAmount??100000)) return 'red';
  if(m.balance<=(S.lowAmount??300000)) return 'warn';
  return '';
}
const LVL = { red:{c:'#d9534f',bg:'#fdeeee',t:'임박'}, warn:{c:'#e08b00',bg:'#fff6e8',t:'주의'} };
function lvlDot(lv){ return lv? `<span class="cat-dot" style="display:inline-block;background:${LVL[lv].c}"></span>` : ''; }
/* 고객의 최고 경고 단계 */
function custLevel(cid){
  const ls = db.memberships.filter(m=>m.customerId===cid && m.status!=='void').map(mshipLevel);
  return ls.includes('red') ? 'red' : ls.includes('warn') ? 'warn' : '';
}
/* 고객 누적 — 결제액 · 관리 인정매출 · 방문 */
function custStats(cid){
  const ms = db.memberships.filter(m=>m.customerId===cid && m.status!=='void' && !m.carry);
  const rs = liveRecords().filter(r=>r.customerId===cid);
  const single = rs.filter(r=>r.payType==='single').reduce((a,r)=>a+r.real,0);
  return {
    paid:  ms.reduce((a,m)=>a+mshipAmount(m),0) + single,
    real:  rs.reduce((a,r)=>a+r.real,0),
    visits: new Set(rs.map(r=>r.date)).size,
    count: rs.length,
    first: rs.map(r=>r.date).sort()[0],
    last:  rs.map(r=>r.date).sort().pop()
  };
}

/* 곧 소진될 회원권 — 미리 재구매를 안내하기 위한 목록 */
function lowMships(storeId){
  return db.memberships.filter(m=>{
    if(storeId && m.storeId!==storeId) return false;
    return !!mshipLevel(m);
  }).sort((a,b)=>{
    const la=mshipLevel(a), lb=mshipLevel(b);
    if(la!==lb) return la==='red'? -1 : 1;
    return (a.type==='count'?a.remain:a.balance/100000) - (b.type==='count'?b.remain:b.balance/100000);
  });
}
function lowRowHTML(m){
  const lv=mshipLevel(m), L=LVL[lv]||LVL.warn;
  return `<div class="warnrow" style="background:${L.bg};border-color:${L.c}33">

    <span style="font-weight:800;color:${L.c}">${m.type==='count'
      ? `${m.remain}회 남음` : `잔액 ${won(m.balance)}원`}<span class="hint" style="color:${L.c}"> ${L.t}</span></span></div>`;
}
function prepaidLabel(p){ return `${won(p.paid/10000)}만원권 (사용 ${won(p.total/10000)}만원)`; }
function countLabel(p){ return `${esc(progText(p.programId))} · ${p.count}회 · ${won(p.price)}원`; }

      <b class="num" style="font-size:.82rem;color:var(--o)">${won(r.real)}원</b>

}

<script>
/* ═══ 회원권 / 관리 기록 계산 엔진 ════════════════════
   저장 시점의 조건을 레코드에 스냅샷으로 남긴다.
   → 이후 가격·수수료율을 바꿔도 과거 정산은 변하지 않는다.
   ═════════════════════════════════════════════════ */

// 고객의 사용 가능한 회원권
function activeMships(custId){
  return db.memberships.filter(m=>m.customerId===custId && m.status!=='void' &&
    (m.type==='prepaid' ? m.balance>0 : m.remain>0));
}
function mshipLabel(m){
  if(m.type==='prepaid')
    return `정액 ${won(m.paid/10000)}만원권 · 잔액 ${won(m.balance)}원 (실매출 ${pct(1-effDiscount(m.paid,m.total),2)} 적용)`;
  return `${progText(m.programId)} ${m.count}회권 · ${m.remain}회 남음 (1회 ${won(countUnit(m.price,m.count))}원)`;
}

/* 한 건의 관리에 대한 계산 결과 */
function calcRecord({payType, mship, minutes, deduct, units, extra, cashAmount, rate}){
  const out = { deduct:0, units:0, extra:0, real:0, fee:0, rate:rate||0, note:'' };
  if(payType==='prepaid'){
    if(!mship) return out;
    out.deduct = R(deduct);
    out.real   = prepaidReal(out.deduct, mship.paid, mship.total);
    out.note   = `정액권 실질할인 ${pct(effDiscount(mship.paid,mship.total),2)} 적용`;
  } else if(payType==='count'){
    if(!mship) return out;
    out.units  = Math.max(0, R(units||1));
    out.extra  = Math.max(0, R(extra||0));
    const unit = countUnit(mship.price, mship.count);
    out.real   = unit*out.units + out.extra;
    out.deduct = out.units;
    out.note   = `1회 인정 ${won(unit)}원 × ${out.units}회` + (out.extra?` + 추가결제 ${won(out.extra)}원`:'');
  } else {                              // single
    out.real   = Math.max(0, R(cashAmount));
    out.note   = '단건 결제';
  }
  out.fee = R(out.real * out.rate);
  return out;
}

/* 횟수권으로 구매한 관리와 다른 관리를 받을 때의 기본 차감 규칙 */
function countSwitchDefault(mship, programId){
  const buyList = mshipList(mship), useList = progPrice(programId);
  if(programId === mship.programId || !buyList || !useList) return { units:1, extra:0 };
  if(db.settings.countSwitch === 'fixed'){
    // 1회 차감 + 정상가 차액을 추가 결제
    return { units:1, extra: Math.max(0, R(useList - buyList)) };
  }
  // 금액 비율 차감 — 횟수는 내림(최소 1회)으로 차감하고, 모자란 금액은 추가 결제
  const need = useList / buyList;
  const units = Math.max(1, Math.floor(need + 1e-9));
  const unitRev = countUnit(mship.price, mship.count);
  const covered = unitRev * units;
  const fair    = R(unitRev * need);
  return { units, extra: Math.max(0, R(fair - covered)) };
}

/* 회원권 차감 / 복원 */
function applyMship(rec, dir){      // dir=+1 차감, -1 복원
  const m = getMship(rec.membershipId); if(!m) return;
  if(rec.payType==='prepaid') m.balance = R(m.balance - dir*rec.deduct);
  if(rec.payType==='count')   { m.remain = m.remain - dir*rec.units; m.used = (m.used||0) + dir*rec.units; }
}

/* ═══ 집계 ════════════════════════════════════════ */
function filterRecs({ym, date, storeId, teacherId}={}){
  return liveRecords().filter(r=>
       (!ym       || ymOf(r.date)===ym)
    && (!date     || r.date===date)
    && (!storeId  || r.storeId===storeId)
    && (!teacherId|| r.teacherId===teacherId));
}
const sumReal = rs => rs.reduce((a,r)=>a+r.real,0);
const sumFee  = rs => rs.reduce((a,r)=>a+r.fee,0);

/* 결제 수입 = 회원권 판매대금 + 단건 결제 (관리 인정 매출과 합산하지 않음) */
function paymentIncome({ym, date, storeId}={}){
  let s = 0;
  db.memberships.forEach(m=>{
    if(m.status==='void' || m.carry) return;      // 이월 등록분은 결제 수입이 아님
    if(ym && ymOf(m.date)!==ym) return;
    if(date && m.date!==date) return;
    if(storeId && m.storeId!==storeId) return;
    s += (m.type==='prepaid') ? m.paid : m.price;
  });
  liveRecords().forEach(r=>{
    if(r.payType!=='single') return;
    if(ym && ymOf(r.date)!==ym) return;
    if(date && r.date!==date) return;
    if(storeId && r.storeId!==storeId) return;
    s += r.real;
  });
  return s;
}

/* 주휴수당 — 1주 소정근로 15시간 이상이면 (주 근로시간÷40)×8시간×시급
   주휴일(일요일)이 속한 달에 지급하므로 월말에 걸친 주도 정확히 잡힌다 */
function weeklyBonusOf(uid_, ym, hourly){
  const S = db.settings.weekly || {};
  if(!S.on || !hourly) return { amount:0, weeks:[] };
  const byWeek = {};
  db.workLogs.filter(w=>w.teacherId===uid_).forEach(w=>{
    const mon = mondayOf(w.date);
    byWeek[mon] = (byWeek[mon]||0) + (+w.hours||0);
  });
  const weeks = [];
  Object.keys(byWeek).sort().forEach(mon=>{
    const sun = addDaysISO(mon,6);
    if(ymOf(sun)!==ym) return;                       // 주휴일이 이 달인 주만
    const h = byWeek[mon];
    const ok = h >= (S.minHours??15);
    const eff = Math.min(h, S.fullHours??40);
    weeks.push({ mon, sun, h, ok,
                 amount: ok ? R(eff/(S.fullHours??40)*(S.payHours??8)*hourly) : 0 });
  });
  return { amount: weeks.reduce((a,w)=>a+w.amount,0), weeks };
}

/* 월 정산 계산 (선생님 1명)
   근무형태별 구성
   · 프리랜서   : 관리 수수료 + 회원권 인센티브 − 원천징수 3.3%
   · 아르바이트 : 시급 × 근무시간 + (관리 인센티브) + 회원권 인센티브 − 4대보험
   · 정규직     : 월 기본급 + 매출 인센티브 + 회원권 인센티브 − 4대보험          */
function settleOf(uid_, ym, storeId){
  const u  = getUser(uid_) || {};
  const scoped = !!storeId;                              // 지점별로 볼 때는 매출 기준만 집계
  const rs = filterRecs({ym, teacherId:uid_, storeId:storeId||null});
  const real = sumReal(rs);
  const fee  = sumFee(rs);                               // 저장된 수수료 누적 (요율 변경에도 불변)

  const msList = db.memberships.filter(m=>m.sellerId===uid_ && m.status!=='void' && ymOf(m.date)===ym
                                       && (!storeId || m.storeId===storeId));
  const msAmt  = msList.reduce((a,m)=>a+mshipAmount(m),0);
  const msInc  = msList.reduce((a,m)=>a+mshipIncOf(m),0);

  const wlogs  = db.workLogs.filter(w=>w.teacherId===uid_ && ymOf(w.date)===ym);
  const hours  = wlogs.reduce((a,w)=>a+(+w.hours||0),0);

  let base=0, baseLabel='', wb={amount:0,weeks:[]};
  if(scoped){ /* 급여·주휴수당은 지점으로 나눌 수 없어 전체 정산에서만 계산 */ }
  else if(empOf(u)==='parttime'){
    base = R(hours*(u.hourly||0)); baseLabel=`시급 ${won(u.hourly||0)}원 × ${hours}시간`;
    if(u.weeklyPay!==false) wb = weeklyBonusOf(uid_, ym, u.hourly||0);
  }
  else if(empOf(u)==='fulltime'){ base = R(u.baseSalary||0); baseLabel='월 기본급'; }
  const hoursShown = scoped ? 0 : hours;

  const gross = base + wb.amount + fee + msInc;
  const dRate = deductRateOf(u);
  const wht   = R(gross * dRate);

  const adjs = db.adjustments.filter(a=>a.teacherId===uid_ && a.ym===ym && a.status==='approved');
  const adj  = adjs.reduce((a,x)=>a+x.amount,0);
  const pay  = R(gross - wht + adj);
  const st   = db.settlements.find(s=>s.teacherId===uid_ && s.ym===ym);
  return { user:u, scoped, count:rs.length, real, fee, base, baseLabel, hours:hoursShown, wlogs:scoped?[]:wlogs,
           weekly:wb.amount, weeks:wb.weeks, storeShare: real - fee,
           msList, msAmt, msInc, gross, dRate, wht, adj, adjs, pay,
           paid:!!st?.paid, paidAt:st?.paidAt,
           pending: db.adjustments.filter(a=>a.teacherId===uid_&&a.ym===ym&&a.status==='pending') };
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   2. 관리 입력
   ═══════════════════════════════════════════════════ */
let IN = null;
function initInput(){
  const myStores = currentUser.storeIds||[];
  IN = { date: todayKST(), storeId: myStores[0] || db.stores[0]?.id,
         custId:'', custName:'', serviceId: progs()[0]?.id, minutes: progMin(progs()[0]?.id),
         payType:'prepaid', mshipId:'', deduct:0, units:1, extra:0, cash:0,

  IN.deduct = progPrice(IN.serviceId);
  IN.cash   = progPrice(IN.serviceId);
}
function renderInput(){

  const stores = isAdmin() ? db.stores : db.stores.filter(s=>(currentUser.storeIds||[]).includes(s.id));
  const el = document.getElementById('p-input');
  el.innerHTML = `
  <div class="card2">
    <div class="sec-t"><i class="bi bi-plus-square-fill"></i>관리 입력</div>

    <div class="gridin">
      <div><div class="form-label">날짜</div>

        ${db.users.filter(u=>u.active!==false).map(u=>`<option value="${u.id}" ${u.id===IN.teacherId?'selected':''}>${esc(u.name)}${u.role==='admin'?' (관리자)':''}</option>`).join('')}
      </select></div>`
     :`<div class="mt-2 hint">담당 선생님: <b>${esc(currentUser.name)}</b> (로그인 계정 자동 지정)</div>`}

    <div class="mt-2"><div class="form-label">고객</div>

             value="${esc(IN.custName)}" onchange="pickCustomer(this.value)">

        정상가 ${wonW(progPrice(IN.serviceId))}${progPrice(IN.serviceId)?'':' — 설정에서 가격을 먼저 입력하세요'}</div>
      ${(()=>{ const m=getMship(IN.mshipId);
        if(!m) return `<div class="hint mt-1" style="color:var(--bad)">↓ 아래 <b>결제 선택</b>에서 회원권을 고르면 할인율이 적용됩니다</div>`;
        const d = m.type==='prepaid' ? effDiscount(m.paid,m.total) : countDisc(m.price,m.count,mshipList(m));
        return `<div class="mt-1" style="font-size:.76rem;font-weight:700;color:var(--o)">
          적용 중: ${esc(m.type==='prepaid'?`정액 ${won(m.paid/10000)}만원권`:`${progText(m.programId)} ${m.count}회권`)}
          · 할인 ${pct(d,2)}</div>`; })()}
    </div>

    <div class="mt-2"><div class="form-label">결제 선택</div>
      ${payChooserHTML()}
    </div>
    ${payDetailHTML()}

      <input class="form-control" value="${esc(IN.memo)}" oninput="IN.memo=this.value" placeholder="특이사항"></div>

    <div id="calcPanel" class="mt-3">${calcPanelHTML()}</div>

    <button class="btn btn-o w-100 mt-3" id="saveBtn" onclick="saveRecord()">
      <i class="bi bi-check2-circle"></i> 관리 완료</button>

/* 아르바이트 선생님이 그날 근무시간을 바로 넣을 수 있게 */
function todayWorkHTML(){
  const tid = isAdmin() ? IN.teacherId : currentUser.id;
  const u = getUser(tid);
  if(!u || empOf(u)!=='parttime') return '';
  const d = IN.date;
  const logs = db.workLogs.filter(w=>w.teacherId===tid && w.date===d);
  const h = logs.reduce((a,w)=>a+(+w.hours||0),0);
  const ym = ymOf(d), mon = db.workLogs.filter(w=>w.teacherId===tid && ymOf(w.date)===ym)
                              .reduce((a,w)=>a+(+w.hours||0),0);
  return `<div class="card2">
    <div class="sec-t"><i class="bi bi-clock-fill"></i>${esc(u.name)} · ${d.slice(5)} 근무시간</div>
    ${h? `<div class="kv"><span>오늘 기록</span><b>${h}시간 · ${wonW(R(h*(u.hourly||0)))}</b></div>`
       : '<div class="hint mb-2">아직 입력되지 않았습니다.</div>'}
    <div class="d-flex gap-2 align-items-end">
      <div><div class="form-label">출근</div><input type="time" id="qIn" class="form-control" onchange="qCalc()"></div>
      <div><div class="form-label">퇴근</div><input type="time" id="qOut" class="form-control" onchange="qCalc()"></div>
      <div style="max-width:86px"><div class="form-label">휴게(분)</div><input type="number" id="qBreak" class="form-control" value="0" onchange="qCalc()"></div>
      <div style="max-width:92px"><div class="form-label">시간</div><input type="number" step="0.5" id="qHours" class="form-control" placeholder="8"></div>
      <button class="btn btn-o btn-xs" onclick="quickWork('${tid}')">기록</button>
    </div>
    <div class="hint mt-2">이번 달 누적 ${mon}시간 · 급여 ${wonW(R(mon*(u.hourly||0)))}
      ${db.settings.weekly.on?` · 주휴수당 ${wonW(weeklyBonusOf(tid,ym,u.hourly||0).amount)}`:''}</div>
  </div>`;
}
function qCalc(){
  const i=document.getElementById('qIn').value, o=document.getElementById('qOut').value;
  if(!i||!o) return;
  const toMin=t=>+t.slice(0,2)*60 + +t.slice(3,5);
  let m=toMin(o)-toMin(i); if(m<0) m+=24*60;
  m -= R(num(document.getElementById('qBreak').value));
  document.getElementById('qHours').value = Math.max(0, Math.round(m/60*100)/100);
}
function quickWork(tid){
  const hours = num(document.getElementById('qHours').value);
  if(hours<=0){ toast('근무시간을 입력하세요','bad'); return; }
  db.workLogs.push({ id:uid(), teacherId:tid, date:IN.date, hours,
    inAt:document.getElementById('qIn').value||'', outAt:document.getElementById('qOut').value||'',
    breakMin:R(num(document.getElementById('qBreak').value)), memo:'',
    createdBy:currentUser.id, createdAt:new Date().toISOString() });
  saveDB(); toast(`${hours}시간 기록 완료`,'ok'); renderInput();
}

function custStateHTML(){
  if(!IN.custName) return '<span class="hint">고객을 선택하거나 새 이름을 입력하세요.</span>';
  if(IN.custId){
    const ms = activeMships(IN.custId);
    if(!ms.length) return `<span class="badge-s badge-n">보유 회원권 없음 — 단건 결제로 입력</span>`;
    return ms.map(m=>`<div class="hint">· ${esc(mshipLabel(m))}</div>`).join('');
  }
  return `<span class="badge-s badge-b">신규 고객 — 저장 시 자동 등록</span>`;
}
function pickCustomer(name){
  IN.custName = name.trim();
  const c = db.customers.find(c=>c.name===IN.custName);
  IN.custId = c?c.id:'';
  IN.mshipId=''; IN.manualPay=false;
  autoPick();
  renderInput();
}
function setProgram(id){
  IN.serviceId=id; IN.minutes=progMin(id);
  if(!IN.touchedDeduct) IN.deduct = progPrice(id);
  IN.cash = progPrice(id);
  autoPick();
  syncFromMship();
  renderInput();
}
function syncFromMship(){
  const m = getMship(IN.mshipId); if(!m) return;
  if(m.type==='count'){
    const d = countSwitchDefault(m, IN.serviceId);
    IN.units = d.units; IN.extra = d.extra;
  }
}

/* 결제 선택 — 정액권 / 횟수권 / 단건을 먼저 고르고, 없으면 그 자리에서 등록 */
function payChooserHTML(){
  const ms   = IN.custId ? activeMships(IN.custId) : [];
  const pre  = ms.filter(m=>m.type==='prepaid');
  const cnt  = ms.filter(m=>m.type==='count');
  const t    = IN.payType;
  const named= !!IN.custName;

  const seg = `<div class="seg" style="margin-bottom:9px">
    <button class="${t==='prepaid'?'on':''}" onclick="setPayType('prepaid')">정액권${pre.length?` ${pre.length}`:''}</button>
    <button class="${t==='count'?'on':''}"   onclick="setPayType('count')">횟수권${cnt.length?` ${cnt.length}`:''}</button>
    <button class="${t==='single'?'on':''}"  onclick="setPayType('single')">단건 결제</button>
  </div>`;

  if(t==='single')
    return seg + payCard('single', true, '단건 결제', '회원권을 쓰지 않고 그날 결제', wonW(IN.cash))
      + (named && !ms.length ? `<div class="hint">회원권으로 차감하려면 위에서 <b>정액권</b> 또는 <b>횟수권</b>을 누르세요 — 그 자리에서 등록됩니다.</div>` : '');

  if(!named)
    return seg + `<div class="hint">고객명을 먼저 입력하세요. 보유 회원권이 자동으로 표시됩니다.</div>`;

  const need = progPrice(IN.serviceId);
  const list = (t==='prepaid'?pre:cnt).map(m=>{
    const on = IN.mshipId===m.id;
    if(m.type==='prepaid'){
      const real = prepaidReal(need, m.paid, m.total);
      return payCard('m:'+m.id, on, `정액 ${won(m.paid/10000)}만원권`,
        `잔액 ${won(m.balance)}원 · 실질할인 ${pct(effDiscount(m.paid,m.total),2)}`,
        m.balance<need ? '<span style="color:var(--bad)">잔액 부족</span>' : `이 관리 ${won(real)}원 인정`);
    }
    const unit = countUnit(m.price, m.count);
    return payCard('m:'+m.id, on, `${esc(progText(m.programId))} ${m.count}회권`,
      `${m.remain}회 남음 · 1회 ${won(unit)}원${m.programId===IN.serviceId?'':' · 다른 관리'}`,
      `이 관리 ${won(unit)}원 인정`);
  }).join('');

  const prods = t==='prepaid'
    ? db.prepaidProducts.filter(x=>x.active!==false).map(x=>`
        <button class="btn btn-ghost btn-xs" onclick="quickMship('prepaid','${x.id}')">
          ${won(x.paid/10000)}만원권 <span class="hint">적립 ${won(x.total/10000)}만 · 할인 ${pct(effDiscount(x.paid,x.total),2)}</span></button>`).join('')
    : [...new Set(db.countProducts.filter(x=>x.active!==false).map(x=>x.count))].sort((a,b)=>a-b)
        .map(c=>{ const x=db.countProducts.find(y=>y.count===c && y.programId===IN.serviceId && y.active!==false)
                        || db.countProducts.find(y=>y.count===c && y.active!==false);
          return `<button class="btn btn-ghost btn-xs" onclick="quickMship('count','${x.id}')">
            ${c}회권 <span class="hint">${esc(progText(x.programId))} ${won(x.price)}원</span></button>`; }).join('');

  return seg + list + `
    <div class="card2 tight" style="background:#fcfbfa;margin:8px 0 0">
      <div class="form-label">${list?'다른 ':''}${t==='prepaid'?'정액권':'횟수권'} 등록 ${IN.custId?'':'<span class="badge-s badge-b">신규 고객</span>'}</div>
      <div class="d-flex gap-2 flex-wrap">${prods || '<span class="hint">설정에서 상품을 먼저 등록하세요.</span>'}
        <button class="btn btn-ghost btn-xs" onclick="openSellMship(IN.custId||IN.custName)">직접 입력</button></div>
      <div class="hint mt-2">이미 쓰고 계시던 회원권이면 등록 창에서 <b>남은 잔액·횟수</b>를 그대로 넣으세요.</div>
    </div>`;
}
function payCard(key, on, title, sub, right){
  return `<div onclick="choosePay('${key}')" style="cursor:pointer;border:1px solid ${on?'var(--o)':'#e8e2de'};
      background:${on?'var(--o-soft)':'#fff'};border-radius:13px;padding:10px 12px;margin-bottom:7px;
      display:flex;align-items:center;gap:10px">
    <i class="bi ${on?'bi-check-circle-fill':'bi-circle'}" style="color:${on?'var(--o)':'#d8d0cb'};font-size:1.05rem"></i>
    <div style="min-width:0"><b style="font-size:.88rem">${title}</b>
      <div class="hint">${sub}</div></div>
    <div class="ms-auto text-end" style="font-size:.78rem;font-weight:700;color:${on?'var(--o)':'var(--mut)'};white-space:nowrap">${right}</div>
  </div>`;
}
function setPayType(t){
  IN.manualPay = true; IN.payType = t;
  if(t==='single'){ IN.mshipId=''; IN.cash = IN.cash || progPrice(IN.serviceId); }
  else {
    const ms = IN.custId ? activeMships(IN.custId).filter(m=>m.type===t) : [];
    IN.mshipId = ms.length ? (ms.find(m=>m.programId===IN.serviceId)||ms[0]).id : '';
    if(IN.mshipId){ syncFromMship(); if(t==='prepaid' && !IN.touchedDeduct) IN.deduct = progPrice(IN.serviceId); }
  }
  renderInput();
}
function choosePay(key){
  IN.manualPay = true;
  if(key==='single'){ IN.payType='single'; IN.mshipId=''; IN.cash = IN.cash||progPrice(IN.serviceId); }
  else {
    const m = getMship(key.slice(2)); if(!m) return;
    IN.payType = m.type; IN.mshipId = m.id; syncFromMship();
    if(m.type==='prepaid' && !IN.touchedDeduct) IN.deduct = progPrice(IN.serviceId);
  }
  renderInput();
}
/* 상품을 눌러 바로 회원권 등록 (등록 창이 열리며 값이 채워진다) */
function quickMship(type, prodId){
  openSellMship(IN.custId||IN.custName);
  SELL.type = type;
  if(type==='prepaid') pickPrepaid(prodId); else pickCount(prodId);
}
/* 고객·관리명이 정해지면 쓸 회원권을 자동으로 고른다 */
function autoPick(){
  if(IN.manualPay){
    const cur = getMship(IN.mshipId);
    if(IN.payType==='single' || (cur && IN.custId && activeMships(IN.custId).some(m=>m.id===cur.id))) return;
  }
  const ms = IN.custId ? activeMships(IN.custId) : [];
  const need = progPrice(IN.serviceId);
  const cnt  = ms.filter(m=>m.type==='count');
  const pick = cnt.find(m=>m.programId===IN.serviceId)
            || ms.find(m=>m.type==='prepaid' && m.balance>=need && need>0)
            || cnt[0] || ms.find(m=>m.type==='prepaid') || null;
  if(pick){ IN.payType=pick.type; IN.mshipId=pick.id; syncFromMship();
            if(pick.type==='prepaid' && !IN.touchedDeduct) IN.deduct = need; }
  else { IN.payType='single'; IN.mshipId=''; IN.cash = need; }
}

/* 선택한 결제 수단의 세부 입력 */
function payDetailHTML(){
  if(IN.payType==='single'){
    return `<div class="mt-2"><div class="form-label">관리 금액 (결제액)</div>
      <input type="text" inputmode="numeric" class="form-control money" value="${won(IN.cash)}" oninput="fmtMoney(this);IN.cash=num(this.value);refreshCalc()">
      <div class="hint mt-1">단건 결제는 결제액이 그대로 관리 인정 매출이 됩니다.</div></div>`;
  }
  const m = getMship(IN.mshipId);
  if(!m) return '';
  if(IN.payType==='prepaid'){
    return `<div class="mt-2"><div class="form-label">관리 차감 금액</div>
      <input type="text" inputmode="numeric" class="form-control money" value="${won(IN.deduct)}" oninput="fmtMoney(this);IN.deduct=num(this.value);IN.touchedDeduct=true;refreshCalc()">
      <div class="hint mt-1">기본값은 ${esc(progText(IN.serviceId))} 정상가 ${wonW(progPrice(IN.serviceId))} · 차감 후 잔액 ${wonW(Math.max(0,m.balance-IN.deduct))}</div></div>`;
  }
  const same = m.programId===IN.serviceId;
  const lock = (!same && !isAdmin()) ? 'readonly style="background:#f6f3f1"' : '';
  return `<div class="mt-2 gridin">
      <div><div class="form-label">차감 횟수</div>
        <input type="number" step="1" min="0" class="form-control" value="${IN.units}" oninput="IN.units=num(this.value);refreshCalc()" ${lock}></div>
      <div><div class="form-label">추가 결제액</div>
        <input type="text" inputmode="numeric" class="form-control money" value="${won(IN.extra)}" oninput="fmtMoney(this);IN.extra=num(this.value);refreshCalc()" ${lock}></div>
    </div>
    <div class="hint mt-1">${same
      ? `구매한 관리(${esc(progText(m.programId))})와 동일 — 1회 차감`
      : `<span class="badge-s badge-b">관리 변경</span> 구매 ${esc(progText(m.programId))} → 이용 ${esc(progText(IN.serviceId))}. 설정 규칙(${db.settings.countSwitch==='fixed'?'1회 차감 + 차액 결제':'금액 비율 차감'})으로 자동 계산했습니다. ${isAdmin()?'관리자는 직접 수정할 수 있습니다.':'차감 기준 변경은 관리자에게 요청하세요.'}`}
      · 차감 후 ${Math.max(0,m.remain-IN.units)}회 남음</div>`;
}

function currentCalc(){
  const u = getUser(IN.teacherId) || currentUser;
  return calcRecord({ payType:IN.payType, mship:getMship(IN.mshipId), minutes:IN.minutes,
    deduct:IN.deduct, units:IN.units, extra:IN.extra, cashAmount:IN.cash,
    rate: (u.rate ?? db.settings.defaultRate) });
}
function calcPanelHTML(){
  const c = currentCalc();
  const u = getUser(IN.teacherId) || currentUser;
  const m = getMship(IN.mshipId);
  const store = R(c.real - c.fee);
  return `<div class="card2 tight" style="background:var(--o-soft);border-color:var(--o-line);margin:0">
    <div class="d-flex justify-content-between align-items-center">
      <div class="lbl" style="color:var(--o)">저장될 금액</div>
      ${IN.payType==='prepaid'&&m?`<span class="badge-s">실질 할인 ${pct(effDiscount(m.paid,m.total),2)}</span>`:''}
      ${IN.payType==='count'&&m?`<span class="badge-s">할인 ${pct(countDisc(m.price,m.count,mshipList(m)),2)}</span>`:''}
    </div>
    <div class="calc-row"><span>사용 회원권</span><b>${m?esc(m.type==='prepaid'?`정액 ${won(m.paid/10000)}만원권`:`${progText(m.programId)} ${m.count}회권`):'단건 결제'}</b></div>
    <div class="calc-row"><span>관리 인정 매출</span><b style="font-size:1.1rem;color:var(--o)">${wonW(c.real)}</b></div>
    <div class="calc-row"><span>선생님 ${feeLabel(u)} (${pct(c.rate,0)})</span><b>${wonW(c.fee)}</b></div>
    ${isAdmin()?`<div class="calc-row"><span>매장 몫</span><b>${wonW(store)}</b></div>`:''}
    <div class="formula mt-1">${esc(c.note)}</div>
  </div>`;
}
function refreshCalc(){ document.getElementById('calcPanel').innerHTML = calcPanelHTML(); }

/* ── 저장 ───────────────────────────────────────── */
function saveRecord(){
  if(IN.saving) return;
  const btn=document.getElementById('saveBtn');
  if(!IN.custName){ toast('고객을 입력하세요','bad'); return; }
  if(!IN.storeId){ toast('지점을 선택하세요','bad'); return; }
  const c = currentCalc();
  const m = getMship(IN.mshipId);

  if(IN.payType!=='single'){
    if(!m){ toast('사용할 회원권을 선택하세요','bad'); return; }
    if(IN.payType==='prepaid'){
      if(c.deduct<=0){ toast('차감 금액을 입력하세요','bad'); return; }
      if(c.deduct > m.balance){ toast(`정액권 잔액 부족 (잔액 ${wonW(m.balance)})`,'bad'); return; }
    } else {
      if(c.units<=0){ toast('차감 횟수를 확인하세요','bad'); return; }
      if(c.units > m.remain){ toast(`남은 횟수 부족 (${m.remain}회 남음)`,'bad'); return; }
    }
  } else if(c.real<=0){ toast('결제 금액을 입력하세요','bad'); return; }

  // 신규 고객 자동 등록
  let custId = IN.custId;
  if(!custId){
    custId = uid();
    db.customers.push({id:custId, name:IN.custName, phone:'', storeId:IN.storeId, memo:'', createdAt:new Date().toISOString()});
  }
  // 중복 방지
  const dup = liveRecords().find(r=>r.date===IN.date && r.customerId===custId && r.teacherId===IN.teacherId
      && r.serviceId===IN.serviceId && r.minutes===IN.minutes);
  if(dup && !confirm('같은 날 같은 고객·프로그램·시간의 기록이 이미 있습니다. 그래도 저장할까요?')) return;

  IN.saving=true; btn.disabled=true;
  const u = getUser(IN.teacherId) || currentUser;
  const rec = {
    id:uid(), date:IN.date, storeId:IN.storeId, teacherId:IN.teacherId, customerId:custId,
    serviceId:IN.serviceId, minutes:IN.minutes, payType:IN.payType, membershipId:IN.mshipId||'',
    listPrice:progPrice(IN.serviceId), deduct:c.deduct, units:c.units, extra:c.extra,
    real:c.real, rate:c.rate, fee:c.fee, memo:IN.memo,
    snapshot: m ? (m.type==='prepaid' ? {type:'prepaid',paid:m.paid,total:m.total}
                                      : {type:'count',count:m.count,price:m.price,programId:m.programId,minutes:m.minutes}) : {type:'single'},
    createdAt:new Date().toISOString(), createdBy:currentUser.id, canceled:false, history:[]
  };
  db.records.push(rec);
  if(m) applyMship(rec, +1);
  saveDB();
  toast(`저장 완료 · 인정매출 ${wonW(c.real)} / 수수료 ${wonW(c.fee)}`,'ok');
  refreshBell();
  const keepStore=IN.storeId, keepDate=IN.date, keepTeacher=IN.teacherId;
  initInput(); IN.storeId=keepStore; IN.date=keepDate; IN.teacherId=keepTeacher;
  renderInput();
}

/* ── 최근 입력 ──────────────────────────────────── */
function recentListHTML(){
  let rs = db.records.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  if(!isAdmin()) rs = rs.filter(r=>r.teacherId===currentUser.id);
  rs = rs.slice(0,25);
  return `<div class="card2">
    <div class="sec-t"><i class="bi bi-clock-history"></i>최근 입력 ${isAdmin()?'(전체)':'(본인)'}</div>
    ${rs.length? `<div class="scroll-x"><table class="tbl">
      <tr><th>날짜</th><th>고객</th><th>관리사</th><th>관리</th><th class="r">인정매출</th><th class="r">수수료</th><th></th></tr>
      ${rs.map(r=>`<tr style="${r.canceled?'opacity:.45':''}">
        <td class="num">${r.date.slice(5)}</td>
        <td>${esc(custName(r.customerId))}<div class="hint">${esc(storeName(r.storeId))}</div></td>
        <td><b>${esc(userName(r.teacherId))}</b><div class="hint">${empName(getUser(r.teacherId))}</div></td>
        <td>${progDot(r.serviceId)} ${esc(progText(r.serviceId))}<div class="hint">${esc(usedText(r))}${r.canceled?' · <span style="color:var(--bad)">취소됨</span>':''}</div></td>
        <td class="r num">${won(r.real)}</td>
        <td class="r num">${won(r.fee)}</td>
        <td class="r">${(isAdmin()&&!r.canceled)?`<button class="btn btn-ghost btn-xs" onclick="openRecord('${r.id}')">수정</button>`:''}</td>
      </tr>`).join('')}
    </table></div>` : '<div class="empty">입력된 관리 내역이 없습니다.</div>'}
  </div>`;
}

function openRecord(id){
  const r = db.records.find(x=>x.id===id); if(!r) return;
  modal(`관리 내역 · ${r.date}`, `
    <div class="kv"><span>고객</span><b>${esc(custName(r.customerId))}</b></div>
    <div class="kv"><span>지점 / 선생님</span><b>${esc(storeName(r.storeId))} · ${esc(userName(r.teacherId))}</b></div>
    <div class="kv"><span>관리</span><b>${esc(progText(r.serviceId))}</b></div>
    <div class="kv"><span>사용 회원권</span><b>${esc(usedMship(r).label)}</b></div>
    ${usedMship(r).disc?`<div class="kv"><span>적용 할인율</span><b style="color:var(--o)">${pct(usedMship(r).disc,2)}</b></div>`:''}
    ${r.payType==='prepaid'?`<div class="kv"><span>차감 금액</span><b>${wonW(r.deduct)}</b></div>`:''}
    ${r.payType==='count'?`<div class="kv"><span>차감 횟수 / 추가결제</span><b>${r.units}회 / ${wonW(r.extra)}</b></div>`:''}
    <div class="kv"><span>관리 인정 매출</span><b style="color:var(--o)">${wonW(r.real)}</b></div>
    <div class="kv"><span>수수료 (${pct(r.rate,0)})</span><b>${wonW(r.fee)}</b></div>
    ${r.memo?`<div class="kv"><span>메모</span><b>${esc(r.memo)}</b></div>`:''}
    <hr class="soft">
    <div class="form-label">관리 인정 매출 수정 (수수료 자동 재계산)</div>
    <input type="text" inputmode="numeric" id="edReal" class="form-control money" value="${won(r.real)}" oninput="fmtMoney(this)">
    <div class="hint mt-1">회원권 차감액은 그대로 유지됩니다. 차감까지 되돌리려면 「관리 취소」를 사용하세요.</div>
    ${r.history?.length?`<hr class="soft"><div class="form-label">변경 이력</div>${r.history.map(h=>`<div class="hint">· ${esc(h)}</div>`).join('')}`:''}
  `, `<button class="btn btn-ghost btn-sm" onclick="cancelRecord('${r.id}')">관리 취소</button>
      <button class="btn btn-o btn-sm" onclick="saveRecordEdit('${r.id}')">저장</button>`);
}
function saveRecordEdit(id){
  const r = db.records.find(x=>x.id===id); if(!r) return;
  const v = num(document.getElementById('edReal').value);
  if(v===r.real){ closeModal(); return; }
  r.history = r.history||[];
  r.history.push(`${nowKSTText()} 인정매출 ${won(r.real)}→${won(v)} (${currentUser.name})`);
  r.real = R(v); r.fee = R(r.real * r.rate);
  saveDB(); closeModal(); toast('수정되었습니다','ok'); renderAll();
}
function cancelRecord(id){
  const r = db.records.find(x=>x.id===id); if(!r || r.canceled) return;
  if(!confirm('이 관리를 취소합니다. 회원권 잔액·횟수와 수수료가 함께 복원됩니다.')) return;
  applyMship(r, -1);
  r.canceled=true; r.canceledAt=new Date().toISOString(); r.canceledBy=currentUser.id;
  r.history=r.history||[]; r.history.push(`${nowKSTText()} 관리 취소 (${currentUser.name}) — 회원권 복원`);
  saveDB(); closeModal(); toast('취소 완료 · 회원권이 복원되었습니다','ok'); renderAll();
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   1. 대시보드
   ═══════════════════════════════════════════════════ */
let DASH = { store:'', ym:null };
const charts = {};
function mkChart(id, cfg){
  const cv = document.getElementById(id); if(!cv) return;
  charts[id]?.destroy();
  charts[id] = new Chart(cv.getContext('2d'), cfg);
}
const CHART_BASE = { responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{ labels:{ boxWidth:10, font:{size:11} } },
            tooltip:{ callbacks:{ label:c=>`${c.dataset.label||''} ${won(c.parsed.y ?? c.parsed)}원` } } },
  scales:{ y:{ beginAtZero:true, ticks:{ font:{size:10}, callback:v=> v>=10000? (v/10000)+'만' : v } },
           x:{ ticks:{ font:{size:10} }, grid:{display:false} } } };

function renderDash(){
  DASH.ym = DASH.ym || thisYM();
  const el=document.getElementById('p-dash');
  const ym=DASH.ym, today=todayKST(), isCur = ym===thisYM();
  const sid = DASH.store || null;

  el.innerHTML = `
  <div class="seg" id="dashSeg">
    <button class="${!DASH.store?'on':''}" onclick="DASH.store='';renderDash()">전체</button>
    ${db.stores.map(s=>`<button class="${DASH.store===s.id?'on':''}" onclick="DASH.store='${s.id}';renderDash()">${esc(s.name)}</button>`).join('')}
  </div>
  <div class="d-flex align-items-center mb-2">
    <button class="btn btn-ghost btn-xs" onclick="DASH.ym=prevYM(DASH.ym);renderDash()"><i class="bi bi-chevron-left"></i></button>
    <div class="fw-bold mx-2" style="font-size:.9rem">${ymText(ym)}</div>
    <button class="btn btn-ghost btn-xs" onclick="DASH.ym=nextYM(DASH.ym);renderDash()"><i class="bi bi-chevron-right"></i></button>
    <div class="ms-auto hint">${isCur?today.slice(5)+' 기준':'마감된 달'}</div>
  </div>
  ${ isAdmin() ? adminDashHTML(ym, sid, today, isCur) : teacherDashHTML(ym, sid, today, isCur) }`;

  if(isAdmin()) drawAdminCharts(ym, sid); else drawTeacherCharts(ym, sid);
}

/* 전월 동기간 비교 */
function cmpPrevSame(ym, sid, teacherId){
  const prev = prevYM(ym);
  const upto = ym===thisYM() ? dayOf(todayKST()) : 31;
  const cur = sumReal(filterRecs({ym, storeId:sid, teacherId}).filter(r=>dayOf(r.date)<=upto));
  const pre = sumReal(filterRecs({ym:prev, storeId:sid, teacherId}).filter(r=>dayOf(r.date)<=upto));
  const diff = cur-pre, rate = pre>0 ? diff/pre : (cur>0?1:0);
  return { cur, pre, diff, rate, upto, prev };
}
function deltaHTML(c){
  const cls = c.diff>=0?'up':'down', ar = c.diff>=0?'▲':'▼';
  return `<span class="delta ${cls}">${ar} ${won(Math.abs(c.diff))}원 (${c.pre>0?pct(Math.abs(c.rate)):'–'})</span>
          <span class="hint"> vs ${ymText(c.prev)} ${c.upto}일까지</span>`;
}

function adminDashHTML(ym, sid, today, isCur){
  const todayRecs = filterRecs({date:today, storeId:sid});
  const monRecs   = filterRecs({ym, storeId:sid});
  const payToday  = paymentIncome({date:today, storeId:sid});
  const payMonth  = paymentIncome({ym, storeId:sid});
  const feeMonth  = teachers().concat(db.users.filter(u=>u.role==='admin'))
        .reduce((a,u)=> a + (sid ? sumFee(filterRecs({ym,storeId:sid,teacherId:u.id})) : settleOf(u.id,ym).fee), 0);
  const payable   = db.users.filter(u=>u.active!==false).reduce((a,u)=>{
        const s=settleOf(u.id,ym); return a + (sid? sumFee(filterRecs({ym,storeId:sid,teacherId:u.id})) : s.pay); },0);
  const c = cmpPrevSame(ym, sid);

  const perStore = db.stores.map(s=>({
    s, today: sumReal(filterRecs({date:today, storeId:s.id})), month: sumReal(filterRecs({ym, storeId:s.id})),
    payT: paymentIncome({date:today, storeId:s.id}), payM: paymentIncome({ym, storeId:s.id})
  }));

  const perTeacher = db.users.filter(u=>u.active!==false).map(u=>{
    const rs = filterRecs({ym, storeId:sid, teacherId:u.id});
    return { u, n:rs.length, real:sumReal(rs), fee:sumFee(rs) };
  }).filter(x=>x.n>0).sort((a,b)=>b.real-a.real);

  return `
  <div class="stat-grid">
    <div class="stat"><div class="lbl">오늘 결제 수입</div><div class="val num">${won(payToday)}<span style="font-size:.8rem">원</span></div>
      <div class="hint">회원권 판매 + 단건</div></div>
    <div class="stat hl"><div class="lbl">오늘 관리 인정 매출</div><div class="val num">${won(sumReal(todayRecs))}<span style="font-size:.8rem">원</span></div>
      <div class="lbl">${todayRecs.length}건</div></div>
    <div class="stat"><div class="lbl">이번 달 관리 인정 매출</div><div class="val sm num">${won(sumReal(monRecs))}원</div>
      <div class="mt-1">${deltaHTML(c)}</div></div>
    <div class="stat"><div class="lbl">이번 달 선생님 지급 예정액</div><div class="val sm num">${won(payable)}원</div>
      <div class="hint">수수료 ${won(feeMonth)}원 기준</div></div>
  </div>
  <div class="card2 mt-2 tight">
    <div class="kv"><span>이번 달 결제 수입 (회원권 판매 등)</span><b class="num">${wonW(payMonth)}</b></div>
    <div class="kv"><span>곧 소진될 회원권</span><b>${lowMships(sid).length}건
      <button class="btn btn-ghost btn-xs ms-1" onclick="go('cust')">보기</button></b></div>
    <div class="hint mt-1">※ 결제 수입과 관리 인정 매출은 성격이 달라 합산하지 않습니다.</div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-bar-chart-fill"></i>지점별 비교</div>
    <div style="height:180px"><canvas id="chStore"></canvas></div>
    <div class="scroll-x mt-2"><table class="tbl">
      <tr><th>지점</th><th class="r">오늘 인정매출</th><th class="r">이번 달 인정매출</th><th class="r">이번 달 결제수입</th></tr>
      ${perStore.map(p=>`<tr><td><b>${esc(p.s.name)}</b></td><td class="r num">${won(p.today)}</td>
        <td class="r num">${won(p.month)}</td><td class="r num">${won(p.payM)}</td></tr>`).join('')}
    </table></div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-graph-up"></i>이번 달 · 전월 매출 추이 (누적)</div>
    <div style="height:200px"><canvas id="chTrend"></canvas></div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-person-badge"></i>선생님별 이번 달 실적</div>
    ${perTeacher.length?`<div class="scroll-x"><table class="tbl">
      <tr><th>선생님</th><th class="r">건수</th><th class="r">인정매출</th><th class="r">수수료</th></tr>
      ${perTeacher.map(t=>`<tr><td><b>${esc(t.u.name)}</b><div class="hint">${esc(teacherStoreText(t.u))}</div></td>
        <td class="r num">${t.n}</td><td class="r num">${won(t.real)}</td><td class="r num">${won(t.fee)}</td></tr>`).join('')}
    </table></div>`:'<div class="empty">이번 달 실적이 없습니다.</div>'}
  </div>`;
}
function teacherStoreText(u){ return (u.storeIds||[]).map(storeName).join(', '); }

function teacherDashHTML(ym, sid, today, isCur){
  const me=currentUser.id;
  const tRecs = filterRecs({date:today, teacherId:me, storeId:sid});
  const mRecs = filterRecs({ym, teacherId:me, storeId:sid});
  const s = settleOf(me, ym);
  const c = cmpPrevSame(ym, sid, me);
  return `
  <div class="stat-grid">
    <div class="stat hl"><div class="lbl">오늘 관리 실적</div><div class="val num">${won(sumReal(tRecs))}<span style="font-size:.8rem">원</span></div>
      <div class="lbl">${tRecs.length}건 · 수수료 ${won(sumFee(tRecs))}원</div></div>
    <div class="stat"><div class="lbl">이번 달 인정 매출</div><div class="val sm num">${won(sumReal(mRecs))}원</div>
      <div class="hint">${mRecs.length}건</div></div>
    <div class="stat"><div class="lbl">이번 달 지급 예정액</div><div class="val sm num">${won(s.pay)}원</div>
      <div class="hint">수수료 ${won(s.fee)}원${s.wht?` · 원천징수 −${won(s.wht)}`:''}</div></div>
    <div class="stat"><div class="lbl">전월 같은 기간 대비</div><div class="mt-1">${deltaHTML(c)}</div></div>
  </div>
  <div class="card2">
    <div class="sec-t"><i class="bi bi-calendar3"></i>날짜별 실적</div>
    <div style="height:190px"><canvas id="chMine"></canvas></div>
  </div>
  <div class="card2">
    <div class="sec-t"><i class="bi bi-list-ul"></i>이번 달 내역</div>
    ${mRecs.length?`<div class="scroll-x"><table class="tbl">
      <tr><th>날짜</th><th>고객</th><th>관리</th><th class="r">인정매출</th><th class="r">수수료</th></tr>
      ${mRecs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr>
        <td class="num">${r.date.slice(5)}</td><td>${esc(custName(r.customerId))}</td>
        <td>${esc(progText(r.serviceId))}</td>
        <td class="r num">${won(r.real)}</td><td class="r num">${won(r.fee)}</td></tr>`).join('')}
    </table></div>`:'<div class="empty">내역이 없습니다.</div>'}
  </div>`;
}

function dailySeries(ym, sid, teacherId){
  const n=daysInYM(ym), arr=new Array(n).fill(0);
  filterRecs({ym, storeId:sid, teacherId}).forEach(r=>{ arr[dayOf(r.date)-1]+=r.real; });
  return arr;
}
function cumulate(a){ let s=0; return a.map(v=>s+=v); }

function drawAdminCharts(ym, sid){
  const today=todayKST();
  mkChart('chStore', { type:'bar',
    data:{ labels: db.stores.map(s=>s.name),
      datasets:[
        { label:'오늘', data: db.stores.map(s=>sumReal(filterRecs({date:today,storeId:s.id}))), backgroundColor:'#f0a97e', borderRadius:6 },
        { label:'이번 달', data: db.stores.map(s=>sumReal(filterRecs({ym,storeId:s.id}))), backgroundColor:'#e56c2d', borderRadius:6 }
      ]}, options: CHART_BASE });

  const prev=prevYM(ym), n=daysInYM(ym);
  const cur=cumulate(dailySeries(ym,sid)), pre=cumulate(dailySeries(prev,sid));
  const cut = ym===thisYM()? dayOf(today) : n;
  mkChart('chTrend', { type:'line',
    data:{ labels: Array.from({length:Math.max(n,pre.length)},(_,i)=>i+1),
      datasets:[
        { label:ymText(prev), data:pre, borderColor:'#c9b8ae', backgroundColor:'transparent', borderWidth:2, pointRadius:0, borderDash:[5,4], tension:.25 },
        { label:ymText(ym), data:cur.map((v,i)=>i<cut?v:null), borderColor:'#e56c2d', backgroundColor:'rgba(229,108,45,.1)', borderWidth:2.5, pointRadius:0, fill:true, tension:.25 }
      ]}, options: CHART_BASE });
}
function drawTeacherCharts(ym, sid){
  const n=daysInYM(ym);
  mkChart('chMine', { type:'bar',
    data:{ labels: Array.from({length:n},(_,i)=>i+1),
      datasets:[{ label:'인정 매출', data: dailySeries(ym,sid,currentUser.id), backgroundColor:'#e56c2d', borderRadius:4 }]},
    options: CHART_BASE });
}
</script>
<script>
/* ═══════════════════════════════════════════════════
   캘린더 — 선생님별 일자별 매출 · 고객
   ═══════════════════════════════════════════════════ */
let CAL = { ym:null, teacherId:null, storeId:'' };
function renderCal(){
  CAL.ym = CAL.ym || thisYM();
  if(!isAdmin()) CAL.teacherId = currentUser.id;
  else if(CAL.teacherId===null) CAL.teacherId = '';          // '' = 전체
  const ym=CAL.ym, tid=CAL.teacherId||null, sid=CAL.storeId||null;
  const rs = filterRecs({ym, teacherId:tid, storeId:sid});
  const custIds = new Set(rs.map(r=>r.customerId));
  const prev = prevYM(ym);
  const prevCust = new Set(filterRecs({ym:prev, teacherId:tid, storeId:sid}).map(r=>r.customerId));
  const n = daysInYM(ym), [y,mo] = ym.split('-').map(Number);
  const first = new Date(Date.UTC(y,mo-1,1)).getUTCDay();
  const today = todayKST();

  const byDay = {};
  rs.forEach(r=>{ (byDay[dayOf(r.date)] = byDay[dayOf(r.date)] || []).push(r); });

  const cells = [];
  for(let i=0;i<first;i++) cells.push('<div class="cell off"></div>');
  for(let d=1; d<=n; d++){
    const list = byDay[d]||[];
    const date = `${ym}-${P2(d)}`;
    const amt  = sumReal(list);
    const names = [...new Set(list.map(r=>`${custName(r.customerId)}(${userName(r.teacherId)})`))];
    cells.push(`<div class="cell ${list.length?'has':''} ${date===today?'today':''}"
        ${list.length?`onclick="calDay('${date}')"`:''}>
      <div class="d">${d}</div>
      ${list.length?`<div class="amt">${won(amt)}</div>
        ${names.slice(0,3).map(x=>`<div class="nm">${esc(x)}</div>`).join('')}
        ${names.length>3?`<div class="nm">외 ${names.length-3}건</div>`:''}`:''}
    </div>`);
  }

  const diff = custIds.size - prevCust.size;
  document.getElementById('p-cal').innerHTML = `
  ${isAdmin()?`<div class="seg">
    <button class="${!CAL.teacherId?'on':''}" onclick="CAL.teacherId='';renderCal()">전체</button>
    ${db.users.filter(u=>u.active!==false).map(u=>`<button class="${CAL.teacherId===u.id?'on':''}" onclick="CAL.teacherId='${u.id}';renderCal()">${esc(u.name)}</button>`).join('')}
  </div>
  <div class="seg">
    <button class="${!CAL.storeId?'on':''}" onclick="CAL.storeId='';renderCal()">전 지점</button>
    ${db.stores.map(st=>`<button class="${CAL.storeId===st.id?'on':''}" onclick="CAL.storeId='${st.id}';renderCal()">${esc(st.name)}</button>`).join('')}
  </div>`:''}

  <div class="d-flex align-items-center mb-2">
    <button class="btn btn-ghost btn-xs" onclick="CAL.ym=prevYM(CAL.ym);renderCal()"><i class="bi bi-chevron-left"></i></button>
    <div class="fw-bold mx-2" style="font-size:.95rem">${ymText(ym)}</div>
    <button class="btn btn-ghost btn-xs" onclick="CAL.ym=nextYM(CAL.ym);renderCal()"><i class="bi bi-chevron-right"></i></button>
    <div class="ms-auto hint">${CAL.teacherId?esc(userName(CAL.teacherId)):'전체'}</div>
  </div>

  <div class="stat-grid mb-2">
    <div class="stat hl"><div class="lbl">이번 달 케어 고객</div><div class="val num">${custIds.size}<span style="font-size:.8rem">명</span></div>
      <div class="lbl">${diff>=0?'▲':'▼'} 전월 ${prevCust.size}명 대비 ${Math.abs(diff)}명</div></div>
    <div class="stat"><div class="lbl">관리 건수</div><div class="val sm num">${rs.length}건</div>
      <div class="hint">고객 1인당 ${custIds.size?(rs.length/custIds.size).toFixed(1):0}회</div></div>
    <div class="stat"><div class="lbl">관리 인정 매출</div><div class="val sm num">${won(sumReal(rs))}원</div></div>
    <div class="stat"><div class="lbl">${CAL.teacherId?feeLabel(getUser(CAL.teacherId)):'수수료 합계'}</div>
      <div class="val sm num">${won(sumFee(rs))}원</div></div>
  </div>

  <div class="card2">
    <div class="cal mb-1">${['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('')}</div>
    <div class="cal">${cells.join('')}</div>
    <div class="hint mt-2">날짜를 누르면 그날 관리한 고객 내역이 보입니다.</div>
  </div>

  <div class="card2">
    <div class="sec-t"><i class="bi bi-person-check"></i>이번 달 고객별 방문</div>
    ${custIds.size? `<div class="scroll-x"><table class="tbl">
      <tr><th>고객</th><th class="r">방문</th><th class="r">인정매출</th><th class="r">최근</th></tr>
      ${[...custIds].map(cid=>{ const l=rs.filter(r=>r.customerId===cid);
        return { cid, n:l.length, amt:sumReal(l), last:l.map(r=>r.date).sort().pop() }; })
        .sort((a,b)=>b.amt-a.amt).map(x=>`<tr>
          <td><b>${esc(custName(x.cid))}</b></td><td class="r num">${x.n}회</td>
          <td class="r num">${won(x.amt)}</td><td class="r hint num">${x.last.slice(5)}</td></tr>`).join('')}
    </table></div>`:'<div class="empty">아직 관리 내역이 없습니다.</div>'}
  </div>`;
}
function calDay(date){
  const rs = filterRecs({date, teacherId:CAL.teacherId||null, storeId:CAL.storeId||null});
  modal(`${date.slice(5).replace('-','월 ')}일 · ${rs.length}건`, `
    <div class="kv"><span>관리 인정 매출</span><b class="num">${wonW(sumReal(rs))}</b></div>
    <div class="kv"><span>${CAL.teacherId?feeLabel(getUser(CAL.teacherId)):'수수료'}</span><b class="num">${wonW(sumFee(rs))}</b></div>
    <hr class="soft">
    <table class="tbl">${rs.map(r=>`<tr>
      <td><b>${esc(custName(r.customerId))}</b><div class="hint">${esc(userName(r.teacherId))} · ${esc(storeName(r.storeId))}</div></td>
      <td>${progDot(r.serviceId)} ${esc(progText(r.serviceId))}
        <div class="hint">${esc(usedText(r))}</div></td>
      <td class="r num">${won(r.real)}원</td></tr>`).join('')}</table>`);
}

/* ═══════════════════════════════════════════════════
   3. 고객 · 회원권
   ═══════════════════════════════════════════════════ */
let CUST = { q:'', store:'' };
function renderCust(){
  const el=document.getElementById('p-cust');
  const q=CUST.q.trim();
  let cs = db.customers.filter(c=>(!q||c.name.includes(q)||(c.phone||'').includes(q)) && (!CUST.store||c.storeId===CUST.store));
  cs = cs.map(c=>{
    const ms = db.memberships.filter(m=>m.customerId===c.id && m.status!=='void');
    const st = custStats(c.id);
    const pre = ms.filter(m=>m.type==='prepaid'), cnt = ms.filter(m=>m.type==='count');
    return { c, st,
             bal: pre.reduce((a,m)=>a+m.balance,0),
             cnt: cnt.reduce((a,m)=>a+m.remain,0),
             balLv: pre.map(mshipLevel).includes('red')?'red':pre.map(mshipLevel).includes('warn')?'warn':'',
             cntLv: cnt.map(mshipLevel).includes('red')?'red':cnt.map(mshipLevel).includes('warn')?'warn':'',
             last: st.last };
  }).sort((a,b)=>{
    const r = {red:0,warn:1,'':2};
    const la=custLevel(a.c.id), lb=custLevel(b.c.id);
    return (r[la]-r[lb]) || (b.last||'').localeCompare(a.last||'');
  });

  el.innerHTML = `
  <div class="seg">
    <button class="${!CUST.store?'on':''}" onclick="CUST.store='';renderCust()">전체</button>
    ${db.stores.map(s=>`<button class="${CUST.store===s.id?'on':''}" onclick="CUST.store='${s.id}';renderCust()">${esc(s.name)}</button>`).join('')}
  </div>
  <div class="d-flex gap-2 mb-2">
    <input class="form-control" placeholder="고객명 · 연락처 검색" value="${esc(CUST.q)}"
           oninput="CUST.q=this.value;clearTimeout(window._ct);window._ct=setTimeout(renderCust,250)">
    <button class="btn btn-o" style="white-space:nowrap" onclick="openSellMship()"><i class="bi bi-ticket-perforated"></i> 회원권</button>
  </div>
  <div class="card2 tight d-flex gap-2">
    <div class="flex-fill"><div class="lbl">고객 수</div><div class="val sm num">${db.customers.length}명</div></div>
    <div class="flex-fill"><div class="lbl">정액권 잔액 합계</div><div class="val sm num">${won(cs.reduce((a,x)=>a+x.bal,0))}원</div></div>
    <div class="flex-fill"><div class="lbl">남은 횟수 합계</div><div class="val sm num">${cs.reduce((a,x)=>a+x.cnt,0)}회</div></div>
    <div class="flex-fill"><div class="lbl">누적 결제액</div><div class="val sm num">${won(cs.reduce((a,x)=>a+x.st.paid,0))}원</div></div>
  </div>
  ${(()=>{ const lw=lowMships(CUST.store||null); return lw.length? `<div class="card2">
    <div class="sec-t"><i class="bi bi-bell-fill"></i>곧 소진 — 재구매 안내 ${lw.length}건
      ${(()=>{const r=lw.filter(m=>mshipLevel(m)==='red').length;
        return r?`<span class="badge-s badge-r ms-1">임박 ${r}</span>`:'';})()}</div>
    <div class="hint"><span style="color:${LVL.red.c}">●</span> 임박: ${db.settings.redCount}회 이하 · ${won(db.settings.redAmount)}원 이하
      &nbsp; <span style="color:${LVL.warn.c}">●</span> 주의: ${db.settings.lowCount}회 이하 · ${won(db.settings.lowAmount)}원 이하</div>
    ${lw.slice(0,8).map(lowRowHTML).join('')}

  <div class="card2">

        <td class="r num" ${x.balLv?`style="color:${LVL[x.balLv].c};font-weight:800"`:''}>${x.bal?won(x.bal):'<span class="hint">–</span>'}</td>
        <td class="r num" ${x.cntLv?`style="color:${LVL[x.cntLv].c};font-weight:800"`:''}>${x.cnt?x.cnt+'회':'<span class="hint">–</span>'}</td>
        <td class="r num">${x.st.paid?won(x.st.paid):'<span class="hint">–</span>'}</td>
        <td class="r num">${x.st.real?won(x.st.real):'<span class="hint">–</span>'}</td>

  </div>`;
}

    ${c.memo?`<div class="kv"><span>메모</span><b>${esc(c.memo)}</b></div>`:''}
    <hr class="soft">

    ${ms.length? ms.map(m=>{ const lv=mshipLevel(m); return `<div class="card2 tight" style="margin-bottom:8px;${lv?`border-color:${LVL[lv].c};background:${LVL[lv].bg}`:''}">

          <div class="d-flex justify-content-between"><b>정액 ${won(m.paid/10000)}만원권</b>

          <div class="kv"><span>사용 가능 총액</span><b class="num">${wonW(m.total)}</b></div>
          <div class="kv"><span>잔액</span><b class="num" style="color:${lv?LVL[lv].c:'var(--o)'}">${wonW(m.balance)}${lv?` · ${LVL[lv].t}`:''}</b></div>
          <div class="kv"><span>실매출 환산율</span><b>${pct(m.paid/m.total,2)} <span class="hint">(실질할인 ${pct(effDiscount(m.paid,m.total),2)})</span></b></div>
        `:`
          <div class="d-flex justify-content-between"><b>횟수권 ${esc(progText(m.programId))} ${m.count}회</b>
            <span class="badge-s">할인 ${pct(countDisc(m.price,m.count,mshipList(m)),2)}</span></div>
          <div class="kv"><span>판매가</span><b class="num">${wonW(m.price)}</b></div>
          <div class="kv"><span>남은 횟수</span><b style="color:${lv?LVL[lv].c:'var(--o)'}">${m.remain} / ${m.count}회${lv?` · ${LVL[lv].t}`:''}</b></div>
          <div class="kv"><span>1회 인정 매출</span><b class="num">${wonW(countUnit(m.price,m.count))}</b></div>
        `}
        <div class="hint mt-1">${m.date} · ${esc(storeName(m.storeId))} 구매${m.sellerId?` · 판매 ${esc(userName(m.sellerId))}`:''}${mshipIncOf(m)?` (인센티브 ${won(mshipIncOf(m))}원)`:''}</div>
        ${isAdmin()?`<button class="btn btn-ghost btn-xs mt-1" onclick="voidMship('${m.id}')">회원권 삭제</button>`:''}
      </div>`; }).join('') : '<div class="hint">보유한 회원권이 없습니다.</div>'}
    <hr class="soft">
    <div class="form-label">관리 이력 (최근 30건)</div>
    ${rs.length?`<table class="tbl">${rs.map(r=>`<tr style="${r.canceled?'opacity:.45':''}">
        <td class="num">${r.date.slice(5)}</td><td>${progDot(r.serviceId)} ${esc(progText(r.serviceId))}${r.canceled?' <span class="badge-s badge-r">취소</span>':''}

function openCustEdit(id){
  const c = id? db.customers.find(x=>x.id===id) : null;
  modal(c?'고객 정보 수정':'고객 추가', `
    <div class="form-label">이름</div><input id="cfName" class="form-control" value="${esc(c?.name||'')}">
    <div class="form-label mt-2">연락처</div><input id="cfPhone" class="form-control" value="${esc(c?.phone||'')}">
    <div class="form-label mt-2">지점</div>
    <select id="cfStore" class="form-select">${db.stores.map(s=>`<option value="${s.id}" ${c?.storeId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <div class="form-label mt-2">메모</div><input id="cfMemo" class="form-control" value="${esc(c?.memo||'')}">
  `, `<button class="btn btn-o btn-sm" onclick="saveCust('${id||''}')">저장</button>`);

function saveCust(id){
  const name=document.getElementById('cfName').value.trim();
  if(!name){ toast('이름을 입력하세요','bad'); return; }
  const o = { name, phone:document.getElementById('cfPhone').value.trim(),
              storeId:document.getElementById('cfStore').value, memo:document.getElementById('cfMemo').value.trim() };
  if(id){ Object.assign(db.customers.find(x=>x.id===id), o); }
